# THROWAWAY PURPOSE-BRANCH DIAGNOSTIC ONLY. Do not merge into main.
# Reproduce only the pre-Cargo Build failure from run 39133843074.
# Historical setup: c92d4a63074b7a499041b3e6a5d3056a5df232b9; source remains unchanged.
name: Windows canonical Build preparation diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-canonical-build-preparation-988f246-39133843074
  cancel-in-progress: false

jobs:
  diagnose-canonical-build-preparation:
    if: >-
      github.repository == 'puntastic/CodexPersonal' &&
      github.ref == 'refs/heads/codex/windows-isolated-tests-20261017' &&
      github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      # Preserve the historical source and job environment, not the later repair.
      SOURCE_SHA: 988f24639c26960426cea0de51f90c81b407f47d
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      RUST_MIN_STACK: "8388608"
      NEXTEST_PROFILE: local

    steps:
      - name: Open bounded diagnostic phase receipts
        timeout-minutes: 1
        run: |
          $diagnostic = Join-Path $env:RUNNER_TEMP "cwbuilddiag-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $diagnostic) { throw 'Diagnostic root must be new.' }
          New-Item -ItemType Directory -Path $diagnostic | Out-Null
          @{
            phase = 'checkout'; state = 'before'; utc = [DateTime]::UtcNow.ToString('o')
            source_sha = $env:SOURCE_SHA; workflow_sha = $env:GITHUB_SHA
            historical_workflow_sha = 'c92d4a63074b7a499041b3e6a5d3056a5df232b9'
            historical_run_id = '39133843074'
            boundary = 'Diagnostic only: no tests, account/ACL mutation, deployment, cache, full qualification or personal-home retention.'
          } | ConvertTo-Json -Compress | Set-Content -LiteralPath (Join-Path $diagnostic 'phases.jsonl') -Encoding utf8

      - name: Check out only the qualified source
        id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify disposable host and establish private run directories
        id: host
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostic = Join-Path $env:RUNNER_TEMP "cwbuilddiag-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          @{ phase = 'host-preparation'; state = 'before'; utc = [DateTime]::UtcNow.ToString('o') } |
            ConvertTo-Json -Compress | Add-Content -LiteralPath (Join-Path $diagnostic 'phases.jsonl')
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:RUNNER_OS -ne 'Windows') {
            throw 'This pilot must run only on a disposable GitHub-hosted Windows VM.'
          }
          $principal = [Security.Principal.WindowsPrincipal]::new([Security.Principal.WindowsIdentity]::GetCurrent())
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'The isolated sandbox tests require an elevated unattended runner.'
          }
          # Preserve historical read-only absence checks; do not provision accounts.
          foreach ($name in @('CodexSandboxOffline', 'CodexSandboxOnline')) {
            if (Get-LocalUser -Name $name -ErrorAction SilentlyContinue) {
              throw "Unexpected pre-existing sandbox account: $name"
            }
          }
          if (Get-LocalGroup -Name 'CodexSandboxUsers' -ErrorAction SilentlyContinue) {
            throw 'Unexpected pre-existing sandbox group.'
          }
          $powerShell = Join-Path $env:ProgramFiles 'PowerShell/7/pwsh.exe'
          if (-not (Test-Path -LiteralPath $powerShell -PathType Leaf)) {
            throw 'The exact PowerShell 7 path used by the native legacy fixtures is required.'
          }
          $head = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:SOURCE_SHA) { throw 'Source SHA mismatch.' }
          # Keep the historical names and environment values; diagnostics are separate.
          $root = Join-Path $env:RUNNER_TEMP "cwspace-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $root) { throw 'Pilot output root must be new.' }
          foreach ($child in @('target', 'test-tmp', 'evidence')) {
            New-Item -ItemType Directory -Path (Join-Path $root $child) | Out-Null
          }
          $evidence = Join-Path $root 'evidence'
          @{
            source_sha = $head; workflow_sha = $env:GITHUB_SHA; workflow_ref = $env:GITHUB_WORKFLOW_REF
            run_id = $env:GITHUB_RUN_ID; run_attempt = $env:GITHUB_RUN_ATTEMPT
            image_os = $env:ImageOS; image_version = $env:ImageVersion; runner_arch = $env:RUNNER_ARCH
            host_os_version = [Environment]::OSVersion.VersionString
            powershell_fixture_path = $powerShell
            powershell_fixture_sha256 = (Get-FileHash -LiteralPath $powerShell -Algorithm SHA256).Hash
            sandbox_accounts_initially_absent = $true
            proof_boundary = 'Historical Build-preparation reproduction only. No native tests, policy repair, deployment or package approval.'
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidence 'provenance.json') -Encoding utf8
          Copy-Item -LiteralPath (Join-Path $evidence 'provenance.json') -Destination (Join-Path $diagnostic 'provenance.json')
          @{
            PILOT_ROOT = $root
            PILOT_EVIDENCE = $evidence
            CARGO_TARGET_DIR = (Join-Path $root 'target')
            CODEX_REPO_ROOT = $env:GITHUB_WORKSPACE
            TEST_TMPDIR = (Join-Path $root 'test-tmp')
            TEMP = (Join-Path $root 'test-tmp')
            TMP = (Join-Path $root 'test-tmp')
          }.GetEnumerator() | ForEach-Object { "$($_.Key)=$($_.Value)" >> $env:GITHUB_ENV }
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, Free, Used |
            ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidence 'initial-disks.json') -Encoding utf8
          Copy-Item -LiteralPath (Join-Path $evidence 'initial-disks.json') -Destination (Join-Path $diagnostic 'initial-disks.json')
          @{ phase = 'host-preparation'; state = 'after'; utc = [DateTime]::UtcNow.ToString('o') } |
            ConvertTo-Json -Compress | Add-Content -LiteralPath (Join-Path $diagnostic 'phases.jsonl')
          @{ phase = 'historical-tool-installation'; state = 'before'; utc = [DateTime]::UtcNow.ToString('o') } |
            ConvertTo-Json -Compress | Add-Content -LiteralPath (Join-Path $diagnostic 'phases.jsonl')

      # Preserve this pin AND the ignored toolchain input. Do not silently repair
      # the historical "Unexpected input(s) 'toolchain'" warning in this reproduction.
      - id: rust
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # historical pin
        with:
          toolchain: "1.95.0"
          targets: x86_64-pc-windows-msvc

      - name: Select Python for the existing build adapters
        id: python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          architecture: x64

      - name: Expose the existing MSVC x64 SDK
        id: msvc
        uses: ./.github/actions/setup-msvc-env
        with:
          target: x86_64-pc-windows-msvc

      - name: Configure checksum-verified V8 inputs from the pinned source
        id: rusty_v8
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-pc-windows-msvc

      - name: Install pinned just
        id: just
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: just@1.51.0

      - name: Install pinned nextest
        id: nextest
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest@0.9.143

      - name: Install pinned ripgrep for the canonical package
        id: ripgrep
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: ripgrep@14.1.1

      - name: Install existing workspace DotSlash prerequisite
        id: dotslash
        uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2

      - name: Expose DotSlash at the Windows fixture lookup path
        id: tools_ready
        run: |
          $directory = Join-Path $env:LOCALAPPDATA 'Microsoft/WindowsApps'
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          Copy-Item -LiteralPath (Get-Command dotslash).Source -Destination (Join-Path $directory 'dotslash.exe')
          $diagnostic = Join-Path $env:RUNNER_TEMP "cwbuilddiag-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $tools = foreach ($name in @('cargo', 'rustup', 'rustc', 'python', 'rg', 'just', 'dotslash', 'cl', 'link', 'git')) {
            $command = Get-Command $name -ErrorAction SilentlyContinue | Select-Object -First 1
            [string]$path = if ($null -ne $command) { $command.Source } else { '' }
            [string]$version = if ($path -and (Test-Path -LiteralPath $path -PathType Leaf)) {
              [string](Get-Item -LiteralPath $path).VersionInfo.FileVersion
            } else { '' }
            @{
              name = $name; resolved = ($null -ne $command)
              path = $path.Substring(0, [Math]::Min(2048, $path.Length))
              file_version = $version.Substring(0, [Math]::Min(256, $version.Length))
            }
          }
          @{
            source_sha = $env:SOURCE_SHA; powershell = $PSVersionTable.PSVersion.ToString()
            powershell_edition = $PSVersionTable.PSEdition; is_64_bit_process = [Environment]::Is64BitProcess
            culture = [Globalization.CultureInfo]::CurrentCulture.Name
            ui_culture = [Globalization.CultureInfo]::CurrentUICulture.Name
            tools = @($tools)
            v8_archive_exists = (-not [string]::IsNullOrWhiteSpace($env:RUSTY_V8_ARCHIVE) -and (Test-Path -LiteralPath $env:RUSTY_V8_ARCHIVE -PathType Leaf))
            v8_binding_exists = (-not [string]::IsNullOrWhiteSpace($env:RUSTY_V8_SRC_BINDING_PATH) -and (Test-Path -LiteralPath $env:RUSTY_V8_SRC_BINDING_PATH -PathType Leaf))
            rust_action_note = 'Historical toolchain input is ignored by the pinned action; actual CLI versions are collected after the attempt.'
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $diagnostic 'preconditions.json') -Encoding utf8
          @{ phase = 'historical-tool-installation'; state = 'after'; utc = [DateTime]::UtcNow.ToString('o') } |
            ConvertTo-Json -Compress | Add-Content -LiteralPath (Join-Path $diagnostic 'phases.jsonl')

      - name: Attempt the unchanged canonical Build with bounded exception evidence
        id: candidate
        timeout-minutes: 2
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $ciBuildDiagnosticRoot = Join-Path $env:RUNNER_TEMP "cwbuilddiag-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          function Limit-CiBuildText([object]$Value, [int]$Limit) {
            $text = [string]$Value
            return $text.Substring(0, [Math]::Min($Limit, $text.Length))
          }
          $ciBuildPhase = 'argument-preparation'
          @{ phase = $ciBuildPhase; state = 'before'; utc = [DateTime]::UtcNow.ToString('o') } |
            ConvertTo-Json -Compress | Add-Content -LiteralPath (Join-Path $ciBuildDiagnosticRoot 'phases.jsonl')
          try {
            # These assignments, precondition and arguments match the historical Build step.
            $env:CODEX_THREAD_ID = "windows-ci-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
            $candidate = Join-Path $env:PILOT_ROOT 'candidate-package'
            $cargo = (Get-Command cargo).Source
            $cargoHome = Split-Path -Parent (Split-Path -Parent $cargo)
            $rustupHome = (& rustup show home).Trim()
            if ($LASTEXITCODE -ne 0) { throw 'Unable to resolve the CI Rustup home.' }
            $drive = [IO.DriveInfo]::new([IO.Path]::GetPathRoot($env:CARGO_TARGET_DIR))
            if ($drive.AvailableFreeSpace -lt 10GB) { throw 'Less than 10 GiB free before canonical package build.' }
            $buildArguments = @{
              Action = 'Build'; CargoProfile = 'dev-small'; PackageDirectory = $candidate
              CargoPath = $cargo; CargoHome = $cargoHome; RustupHome = $rustupHome
              PythonPath = (Get-Command python).Source; RipgrepPath = (Get-Command rg).Source; Json = $true
            }
            @{
              phase = $ciBuildPhase; state = 'after'; utc = [DateTime]::UtcNow.ToString('o')
              # This fixed argument allowlist contains tool/package paths, not credentials.
              build_arguments = $buildArguments; available_bytes = $drive.AvailableFreeSpace
            } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $ciBuildDiagnosticRoot 'build-before.json') -Encoding utf8
            $ciBuildPhase = 'canonical-entrypoint'
            @{ phase = $ciBuildPhase; state = 'before'; utc = [DateTime]::UtcNow.ToString('o') } |
              ConvertTo-Json -Compress | Add-Content -LiteralPath (Join-Path $ciBuildDiagnosticRoot 'phases.jsonl')
            # Exact original call. No Deploy, tests, source patch, cache, or subsequent qualification.
            $resultText = & ./codex-dev.ps1 @buildArguments
            @{
              phase = $ciBuildPhase; state = 'returned-without-exception'; utc = [DateTime]::UtcNow.ToString('o')
              classification = 'historical-failure-not-reproduced'; result_item_count = @($resultText).Count
            } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $ciBuildDiagnosticRoot 'build-returned.json') -Encoding utf8
          } catch {
            $record = $_
            $inner = @()
            $exception = $record.Exception.InnerException
            for ($depth = 0; $null -ne $exception -and $depth -lt 4; $depth++) {
              $inner += @{
                type = Limit-CiBuildText $exception.GetType().FullName 512
                message = Limit-CiBuildText $exception.Message 2048
                message_chars = ([string]$exception.Message).Length
                message_truncated = (([string]$exception.Message).Length -gt 2048)
              }
              $exception = $exception.InnerException
            }
            $invocation = $record.InvocationInfo
            $stack = [string]$record.ScriptStackTrace
            $message = [string]$record.Exception.Message
            @{
              phase = $ciBuildPhase; state = 'exception'; utc = [DateTime]::UtcNow.ToString('o')
              exception_type = Limit-CiBuildText $record.Exception.GetType().FullName 512
              message = Limit-CiBuildText $message 4096
              message_chars = $message.Length; message_truncated = ($message.Length -gt 4096)
              inner_exceptions = $inner; inner_exceptions_truncated = ($null -ne $exception)
              script_stack_trace = Limit-CiBuildText $stack 16384
              script_stack_trace_chars = $stack.Length; script_stack_trace_truncated = ($stack.Length -gt 16384)
              invocation_script = if ($null -ne $invocation) { Limit-CiBuildText $invocation.ScriptName 2048 } else { $null }
              invocation_line = if ($null -ne $invocation) { $invocation.ScriptLineNumber } else { $null }
              invocation_offset = if ($null -ne $invocation) { $invocation.OffsetInLine } else { $null }
              historical_message_match = ($message -eq 'You cannot call a method on a null-valued expression.')
              proof_boundary = 'An observed exception, not a cause diagnosis or a repaired Build.'
            } | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $ciBuildDiagnosticRoot 'build-exception.json') -Encoding utf8
            # Do not serialize ErrorRecord, TargetObject, environment or credentials.
            throw
          }
          # A surprisingly completed Build is not successful reproduction/qualification.
          throw 'Historical pre-Cargo failure was not reproduced; no qualification or deployment was attempted.'

      - name: Record outcome and bounded post-attempt tool versions
        if: always()
        timeout-minutes: 2
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          HOST_OUTCOME: ${{ steps.host.outcome }}
          RUST_OUTCOME: ${{ steps.rust.outcome }}
          PYTHON_OUTCOME: ${{ steps.python.outcome }}
          MSVC_OUTCOME: ${{ steps.msvc.outcome }}
          V8_OUTCOME: ${{ steps.rusty_v8.outcome }}
          JUST_OUTCOME: ${{ steps.just.outcome }}
          NEXTEST_OUTCOME: ${{ steps.nextest.outcome }}
          RIPGREP_OUTCOME: ${{ steps.ripgrep.outcome }}
          DOTSLASH_OUTCOME: ${{ steps.dotslash.outcome }}
          TOOLS_OUTCOME: ${{ steps.tools_ready.outcome }}
          BUILD_OUTCOME: ${{ steps.candidate.outcome }}
        run: |
          $diagnostic = Join-Path $env:RUNNER_TEMP "cwbuilddiag-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $diagnostic -Force | Out-Null
          $before = Test-Path -LiteralPath (Join-Path $diagnostic 'build-before.json')
          $exception = Test-Path -LiteralPath (Join-Path $diagnostic 'build-exception.json')
          $returned = Test-Path -LiteralPath (Join-Path $diagnostic 'build-returned.json')
          $classification = if ($exception) { 'exception-recorded-inspect-message-and-stack' }
            elseif ($returned) { 'historical-failure-not-reproduced' }
            elseif ($before) { 'incomplete-timeout-or-aborted-no-after-receipt' }
            else { 'entrypoint-not-reached' }
          @{
            utc = [DateTime]::UtcNow.ToString('o'); classification = $classification
            before_receipt = $before; exception_receipt = $exception; returned_receipt = $returned
            outcomes = @{
              checkout = $env:CHECKOUT_OUTCOME; host = $env:HOST_OUTCOME; rust = $env:RUST_OUTCOME
              python = $env:PYTHON_OUTCOME; msvc = $env:MSVC_OUTCOME; v8 = $env:V8_OUTCOME
              just = $env:JUST_OUTCOME; nextest = $env:NEXTEST_OUTCOME; ripgrep = $env:RIPGREP_OUTCOME
              dotslash = $env:DOTSLASH_OUTCOME; tools_ready = $env:TOOLS_OUTCOME; build = $env:BUILD_OUTCOME
            }
            qualification_passed = $false; deployed = $false
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $diagnostic 'outcome.json') -Encoding utf8
          @{ phase = 'post-attempt-versions'; state = 'before'; utc = [DateTime]::UtcNow.ToString('o') } |
            ConvertTo-Json -Compress | Add-Content -LiteralPath (Join-Path $diagnostic 'phases.jsonl')
          # Run version commands only after the reproduction attempt; never warm
          # Rustup before the historical Build call. No environment dump is retained.
          foreach ($spec in @(
            @{ name = 'cargo'; args = @('--version') },
            @{ name = 'rustc'; args = @('-Vv') },
            @{ name = 'rustup'; args = @('show', 'active-toolchain') },
            @{ name = 'python'; args = @('--version') },
            @{ name = 'just'; args = @('--version') },
            @{ name = 'cargo-nextest'; command = 'cargo'; args = @('nextest', '--version') },
            @{ name = 'rg'; args = @('--version') },
            @{ name = 'dotslash'; args = @('--version') }
          )) {
            $entry = @{ name = $spec.name; timing = 'after-build-attempt'; path = $null; output = @(); problem = $null }
            try {
              $name = if ($spec.ContainsKey('command')) { $spec.command } else { $spec.name }
              $command = Get-Command $name -ErrorAction Stop
              $entry.path = $command.Source
              $entry.output = @(& $command.Source @($spec.args) 2>&1 | Select-Object -First 16 | ForEach-Object {
                $line = [string]$_
                $line.Substring(0, [Math]::Min(512, $line.Length))
              })
              $entry.exit_code = $LASTEXITCODE
            } catch {
              $message = [string]$_.Exception.Message
              $entry.problem = $message.Substring(0, [Math]::Min(1024, $message.Length))
            }
            $entry | ConvertTo-Json -Depth 4 -Compress |
              Add-Content -LiteralPath (Join-Path $diagnostic 'tool-versions.jsonl') -Encoding utf8
          }
          @{ phase = 'post-attempt-versions'; state = 'after'; utc = [DateTime]::UtcNow.ToString('o') } |
            ConvertTo-Json -Compress | Add-Content -LiteralPath (Join-Path $diagnostic 'phases.jsonl')

      - name: Enforce small evidence allowlist
        if: always()
        timeout-minutes: 1
        run: |
          $diagnostic = Join-Path $env:RUNNER_TEMP "cwbuilddiag-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $names = @('phases.jsonl', 'provenance.json', 'initial-disks.json', 'preconditions.json',
            'build-before.json', 'build-exception.json', 'build-returned.json', 'outcome.json', 'tool-versions.jsonl')
          $retained = Join-Path $diagnostic 'retained'
          New-Item -ItemType Directory -Path $retained -Force | Out-Null
          $files = @()
          $bytes = 0L
          foreach ($name in $names) {
            $path = Join-Path $diagnostic $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { continue }
            $file = Get-Item -LiteralPath $path
            # Reserve 4 KiB of the total bound for the evidence manifest itself.
            $accepted = ($file.Length -le 64KB -and $bytes + $file.Length -le 252KB)
            $files += @{ name = $name; bytes = $file.Length; retained = $accepted }
            if ($accepted) {
              Copy-Item -LiteralPath $path -Destination (Join-Path $retained $name)
              $bytes += $file.Length
            }
          }
          $manifest = @{ files = $files; retained_payload_bytes = $bytes; per_file_limit = 65536; payload_limit = 258048; total_limit = 262144 } |
            ConvertTo-Json -Depth 4
          if ([Text.Encoding]::UTF8.GetByteCount($manifest) -gt 4092) {
            throw 'Evidence manifest exceeded its reserved size; diagnostic evidence is incomplete.'
          }
          $manifest | Set-Content -LiteralPath (Join-Path $retained 'evidence-manifest.json') -Encoding utf8
          # No profiles, configuration, build packages, test homes, caches, full
          # logs, raw ErrorRecords, account data or credentials are uploaded.

      - name: Retain only bounded preparation diagnostic evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: windows-build-preparation-988f246-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cwbuilddiag-${{ github.run_id }}-${{ github.run_attempt }}/retained/
          retention-days: 1
          if-no-files-found: warn
