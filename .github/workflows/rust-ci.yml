# THROWAWAY PURPOSE-BRANCH PILOT ONLY. Do not merge this replacement into main.
# Reuses the existing workflow ID/path for dispatch with ref=codex/windows-isolated-tests-20261017.
# Production code is checked out at SOURCE_SHA; the workflow revision is recorded separately.
# Reviewed fixture-only source is pinned; native effects stay on this disposable VM.
name: Windows filesystem baseline confirmation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-filesystem-baseline-confirmation
  cancel-in-progress: false

jobs:
  qualify-filesystem-baseline-cases:
    if: >-
      github.repository == 'puntastic/CodexPersonal' &&
      github.ref == 'refs/heads/codex/windows-isolated-tests-20261017' &&
      github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      # Reviewed/formatted/linted fixture-only repair; native compilation is a job gate.
      SOURCE_SHA: 3c9af802b8c8505fdd2d4e7c5828f0baec6b1667
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      RUST_MIN_STACK: "8388608"
      NEXTEST_PROFILE: local

    steps:
      - name: Check out only the qualified source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify disposable host and establish private run directories
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:RUNNER_OS -ne 'Windows') {
            throw 'This pilot must run only on a disposable GitHub-hosted Windows VM.'
          }
          $principal = [Security.Principal.WindowsPrincipal]::new([Security.Principal.WindowsIdentity]::GetCurrent())
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'The isolated sandbox tests require an elevated unattended runner.'
          }
          foreach ($name in @('CodexSandboxOffline', 'CodexSandboxOnline')) {
            if (Get-LocalUser -Name $name -ErrorAction SilentlyContinue) {
              throw "Unexpected pre-existing sandbox account: $name"
            }
          }
          if (Get-LocalGroup -Name 'CodexSandboxUsers' -ErrorAction SilentlyContinue) {
            throw 'Unexpected pre-existing sandbox group.'
          }
          $powerShell = Join-Path $env:ProgramFiles 'PowerShell/7/pwsh.exe'
          if (-not (Test-Path -LiteralPath $powerShell -PathType Leaf)) {
            throw 'The exact PowerShell path used by the native legacy fixtures is required.'
          }
          if ($env:SOURCE_SHA -notmatch '^[0-9a-f]{40}$') { throw 'Reviewed source SHA has not been pinned.' }
          $head = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:SOURCE_SHA) { throw 'Source SHA mismatch.' }
          $root = Join-Path $env:RUNNER_TEMP "cwfsprobe-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $root) { throw 'Pilot output root must be new.' }
          foreach ($child in @('target', 'test-tmp', 'evidence')) {
            New-Item -ItemType Directory -Path (Join-Path $root $child) | Out-Null
          }
          $evidence = Join-Path $root 'evidence'
          @{
            source_sha = $head
            workflow_sha = $env:GITHUB_SHA
            workflow_ref = $env:GITHUB_WORKFLOW_REF
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            image_os = $env:ImageOS
            image_version = $env:ImageVersion
            runner_arch = $env:RUNNER_ARCH
            host_os_version = [Environment]::OSVersion.VersionString
            powershell_fixture_path = $powerShell
            powershell_fixture_sha256 = (Get-FileHash -LiteralPath $powerShell -Algorithm SHA256).Hash
            sandbox_accounts_initially_absent = $true
            cleanup_boundary = 'Native, account, desktop and test-path ACL effects occur only on this disposable Windows 2025 VM. No extra provisioning, PID killing, force cleanup or global uninstall; the VM is discarded.'
            proof_boundary = 'Exactly 10 selected nonignored Rust cases in file_system_windows: the existing 9 native filesystem diagnostics plus one pure error check. The single group is serial, retries zero, with exact ignored=false/default inventory checks. The ignored inherited-baseline discriminator remains in source but is not selected; its prior observations and the legacy/account groups remain historical evidence. The separate Python capture-helper self-tests are not part of this Rust population. No full workspace inventory/run, canonical package, installation or deployment. Passes may include explicitly reported unsupported-token early returns and do not establish full path coverage or a production isolation repair.'
            accepted_limitation = 'legacy_workspace_write_delete_is_limited_to_writable_roots is deliberately not selected. Its known boundary remains unresolved, not xfailed or converted into a passing security claim.'
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidence 'provenance.json') -Encoding utf8
          @{
            PILOT_ROOT = $root
            PILOT_EVIDENCE = $evidence
            CARGO_TARGET_DIR = (Join-Path $root 'target')
            CODEX_REPO_ROOT = $env:GITHUB_WORKSPACE
            TEST_TMPDIR = (Join-Path $root 'test-tmp')
            TEMP = (Join-Path $root 'test-tmp')
            TMP = (Join-Path $root 'test-tmp')
          }.GetEnumerator() | ForEach-Object { "$($_.Key)=$($_.Value)" >> $env:GITHUB_ENV }
          # Do not invoke setup-ci: its Dev Drive/VHD provisioning is outside this small pilot.
          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name, Free, Used |
            ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidence 'initial-disks.json') -Encoding utf8

      - name: Select Python for the existing build adapters
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          architecture: x64

      - name: Qualify capture helper on runner Python before Rust builds
        timeout-minutes: 3
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $python = (Get-Command python -CommandType Application | Select-Object -First 1).Source
          $helper = Join-Path $env:GITHUB_WORKSPACE 'scripts/windows_desktop_dev/capture_native_command.py'
          $tests = Join-Path $env:GITHUB_WORKSPACE 'scripts/windows_desktop_dev'
          $capture = Join-Path $env:PILOT_ROOT 'native-capture-selftest'
          # Only the helper's harmless stdlib regression suite: finite,
          # self-expiring fixture children; no Rust, native ACL or account work.
          & $python $helper --output-dir $capture --cwd $env:GITHUB_WORKSPACE -- $python -m unittest discover -s $tests -p test_capture_native_command.py -v
          $wrapperExit = $LASTEXITCODE
          $native = Get-Content -LiteralPath (Join-Path $capture 'native-result.json') -Raw | ConvertFrom-Json
          $phase = Get-Content -LiteralPath (Join-Path $capture 'capture-phase.json') -Raw | ConvertFrom-Json
          if ($wrapperExit -ne 0 -or $native.schema_version -ne 1 -or $native.status -ne 'root-exited' -or
              $native.root_exit_code -ne 0 -or $phase.schema_version -ne 1 -or
              $phase.phase -ne 'capture-complete' -or $phase.status -ne 'complete') {
            throw 'Capture helper self-tests failed or did not retain complete native/capture receipts; Rust work not started.'
          }

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: "1.95.0"
          targets: x86_64-pc-windows-msvc

      - name: Expose the existing MSVC x64 SDK
        uses: ./.github/actions/setup-msvc-env
        with:
          target: x86_64-pc-windows-msvc

      - name: Configure checksum-verified V8 inputs for the selected Core helpers
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-pc-windows-msvc

      - name: Install pinned just
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: just@1.51.0

      - name: Install pinned nextest
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest@0.9.143

      - name: Install pinned ripgrep for selected deny-glob resolution
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: ripgrep@14.1.1

      - name: Build selected helpers, verify exact inventories, then run serial groups
        working-directory: codex-rs
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          foreach ($name in @('RUNFILES_MANIFEST_ONLY', 'CODEX_WINDOWS_REGISTERED_CORE')) {
            # A null method argument can leave an empty-but-present marker in pwsh.
            Remove-Item -LiteralPath "Env:$name" -ErrorAction SilentlyContinue
            if ([Environment]::GetEnvironmentVariables('Process').Contains($name)) {
              throw "Inherited environment marker is still present: $name"
            }
          }
          function Save-DiskObservation([string]$Phase) {
            $drive = [IO.DriveInfo]::new([IO.Path]::GetPathRoot($env:CARGO_TARGET_DIR))
            @{
              phase = $Phase
              utc = [DateTime]::UtcNow.ToString('o')
              available_bytes = $drive.AvailableFreeSpace
              total_bytes = $drive.TotalSize
            } | ConvertTo-Json -Compress | Add-Content -LiteralPath (Join-Path $env:PILOT_EVIDENCE 'disk-observations.jsonl')
            if ($drive.AvailableFreeSpace -lt 2GB) { throw "Less than 2 GiB free before $Phase; resource pilot stopped." }
          }
          function Save-Phase([string]$Group, [string]$Phase, [string]$Status, $Result = $null) {
            @{ group = $Group; phase = $Phase; status = $Status; utc = [DateTime]::UtcNow.ToString('o'); result = $Result } |
              ConvertTo-Json -Depth 12 -Compress |
              Add-Content -LiteralPath (Join-Path $env:PILOT_EVIDENCE 'phases.jsonl') -Encoding utf8
          }
          # Snapshot at most 128 KiB from each raw stream; never follow descendant EOF.
          function Save-DiagnosticTail([string]$Source, [string]$Name) {
            if (-not (Test-Path -LiteralPath $Source -PathType Leaf)) { return @{ present = $false } }
            $stream = [IO.File]::Open($Source, [IO.FileMode]::Open, [IO.FileAccess]::Read, [IO.FileShare]::ReadWrite)
            try {
              $size = $stream.Length
              $count = [int][Math]::Min($size, 128KB)
              [void]$stream.Seek($size - $count, [IO.SeekOrigin]::Begin)
              $bytes = [byte[]]::new($count)
              $read = 0
              while ($read -lt $count) {
                $next = $stream.Read($bytes, $read, $count - $read)
                if ($next -eq 0) { break }
                $read += $next
              }
              $retained = [byte[]]::new($read)
              [Array]::Copy($bytes, $retained, $read)
              [IO.File]::WriteAllBytes((Join-Path $env:PILOT_EVIDENCE "$Name-tail.txt"), $retained)
              $text = [Text.Encoding]::UTF8.GetString($bytes, 0, $read)
              return @{ present = $true; snapshot_bytes = $size; retained_bytes = $read; truncated = ($size -gt $read); unsupported_token_observed = $text.Contains('outcome=unsupported-restricted-token'); completeness = 'snapshot-only; descendant completion not established' }
            } finally { $stream.Dispose() }
          }
          $captureHelper = Join-Path $env:GITHUB_WORKSPACE 'scripts/windows_desktop_dev/capture_native_command.py'
          $python = (Get-Command python -CommandType Application | Select-Object -First 1).Source
          $cargo = (Get-Command cargo -CommandType Application | Select-Object -First 1).Source
          $just = (Get-Command just -CommandType Application | Select-Object -First 1).Source
          if (-not (Test-Path -LiteralPath $captureHelper -PathType Leaf)) { throw 'Pinned source lacks the reviewed capture helper.' }
          function Invoke-Captured([string]$Label, [string[]]$NativeArguments) {
            $directory = Join-Path $env:PILOT_ROOT "native-$Label"
            Save-Phase $Label 'native-invocation' 'running'
            & $python $captureHelper --output-dir $directory --cwd $PWD.Path -- @NativeArguments | Out-Host
            $wrapperExit = $LASTEXITCODE
            Save-Phase $Label 'native-receipt-open' 'running'
            $native = Get-Content -LiteralPath (Join-Path $directory 'native-result.json') -Raw | ConvertFrom-Json
            $capture = Get-Content -LiteralPath (Join-Path $directory 'capture-phase.json') -Raw | ConvertFrom-Json
            if ($native.schema_version -ne 1 -or $native.status -ne 'root-exited' -or
                $null -eq $native.root_exit_code -or ($native.root_exit_code -isnot [long] -and $native.root_exit_code -isnot [int]) -or
                $capture.schema_version -ne 1) { throw "Missing or invalid native completion receipt for $Label." }
            $observed = @{
              directory = $directory; exit_code = $native.root_exit_code; wrapper_exit_code = $wrapperExit
              capture_complete = ($capture.status -eq 'complete' -and $capture.phase -eq 'capture-complete')
              root_exit_observed_utc = $native.root_exit_observed_utc
              descendant_completion = $native.descendant_completion; log_completeness = $native.log_completeness
            }
            Save-Phase $Label 'native-observed' 'complete' $observed
            return $observed
          }
          function Get-SelectedCases([hashtable]$Inventory, [hashtable]$Plan) {
            if (-not $Inventory.ContainsKey('rust-suites')) { throw 'Unsupported nextest inventory.' }
            if (-not $Plan.ContainsKey('expected_ignored') -or $Plan.expected_ignored -isnot [bool] -or $Plan.expected_ignored) {
              throw 'Plan must explicitly require ignored=false.'
            }
            if (-not $Plan.ContainsKey('run_ignored') -or $Plan.run_ignored -cne 'default') {
              throw 'Plan must use nextest --run-ignored default.'
            }
            $actual = @()
            foreach ($suite in $Inventory['rust-suites'].Values) {
              if ($suite['status'] -ne 'listed') { continue }
              foreach ($case in $suite['testcases'].GetEnumerator()) {
                if ($case.Value['filter-match']['status'] -ne 'matches') { continue }
                if ($suite['package-name'] -cne $Plan.package -or $suite['binary-name'] -cne $Plan.binary -or
                    $suite['binary-id'] -isnot [string] -or [string]::IsNullOrWhiteSpace($suite['binary-id']) -or
                    $case.Value['ignored'] -isnot [bool] -or $case.Value['ignored'] -ne $Plan.expected_ignored) {
                  throw 'Unexpected package/binary, unsupported inventory or ignored-status mismatch.'
                }
                $actual += @{ package = $suite['package-name']; binary = $suite['binary-name']; binary_id = $suite['binary-id']; test = $case.Key; binary_path = $suite['binary-path']; ignored = $case.Value['ignored'] }
              }
            }
            if ($actual.Count -ne $Plan.names.Count -or
                @(Compare-Object ($Plan.names | Sort-Object) ($actual.test | Sort-Object) -CaseSensitive).Count -ne 0) {
              throw "Selected test names differ from the exact allowlist for $($Plan.label); no tests executed."
            }
            return $actual
          }
          function Get-CaseKey($Case) {
            ConvertTo-Json -InputObject @($Case.binary_id, $Case.test) -Compress
          }
          function Assert-SameCases($Expected, $Actual) {
            $left = @($Expected | ForEach-Object { Get-CaseKey $_ } | Sort-Object)
            $right = @($Actual | ForEach-Object { Get-CaseKey $_ } | Sort-Object)
            if ($left.Count -ne $right.Count -or $right.Count -ne @($right | Select-Object -Unique).Count -or
                @(Compare-Object $left $right -CaseSensitive).Count -ne 0) { throw 'Case identity sets differ or contain duplicates.' }
          }
          function Read-JUnitReport([string]$Group, [string]$Path, $Expected, [DateTime]$StartedUtc) {
            Save-Phase $Group 'junit-open' 'running'
            $file = Get-Item -LiteralPath $Path -ErrorAction Stop
            if ($file.PSIsContainer -or $file.Length -eq 0 -or $file.Length -gt 32MB -or $file.LastWriteTimeUtc -lt $StartedUtc) {
              throw 'JUnit is empty, oversized or older than this invocation.'
            }
            $settings = [Xml.XmlReaderSettings]::new()
            $settings.DtdProcessing = [Xml.DtdProcessing]::Prohibit
            $settings.XmlResolver = $null
            $document = [Xml.XmlDocument]::new()
            $document.XmlResolver = $null
            $reader = [Xml.XmlReader]::Create($file.FullName, $settings)
            try { $document.Load($reader) } finally { $reader.Dispose() }
            Save-Phase $Group 'junit-validate' 'running'
            $cases = @($document.SelectNodes('/testsuites/testsuite/testcase'))
            if ($document.DocumentElement.get_Name() -ne 'testsuites' -or
                $document.SelectNodes('//testcase').Count -ne $cases.Count) { throw 'Unexpected JUnit structure.' }
            $actual = @($cases | ForEach-Object { @{ binary_id = $_.GetAttribute('classname'); test = $_.GetAttribute('name') } })
            Assert-SameCases $Expected $actual
            foreach ($node in $document.SelectNodes('/testsuites | /testsuites/testsuite')) {
              foreach ($counter in @('tests', 'failures', 'errors')) {
                if (-not $node.HasAttribute($counter) -or $node.GetAttribute($counter) -notmatch '^\d+$') {
                  throw 'JUnit required counters missing or invalid.'
                }
              }
              foreach ($entry in @{ tests = './/testcase'; failures = './/testcase[failure]'; errors = './/testcase[error]'; skipped = './/testcase[skipped]' }.GetEnumerator()) {
                if ($node.HasAttribute($entry.Key)) {
                  if ($node.GetAttribute($entry.Key) -notmatch '^\d+$' -or
                      [long]$node.GetAttribute($entry.Key) -ne $node.SelectNodes($entry.Value).Count) {
                    throw "JUnit $($entry.Key) counter disagrees with actual cases."
                  }
                } elseif ($node.SelectNodes($entry.Value).Count -ne 0) { throw 'JUnit omitted a nonzero counter.' }
              }
            }
            $failures = $document.SelectNodes('//testcase[failure]').Count
            $errors = $document.SelectNodes('//testcase[error]').Count
            $skipped = $document.SelectNodes('//testcase[skipped]').Count
            $retries = $document.SelectNodes('//flakyFailure | //flakyError | //rerunFailure | //rerunError').Count
            # Failed tests are valid observations, not malformed receipts.
            return @{
              tests = $cases.Count; failures = $failures; errors = $errors; skipped = $skipped; retries = $retries
              passing = ($failures + $errors + $skipped + $retries -eq 0)
              sha256 = (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash
            }
          }
          $plans = @(
            @{
              label = 'filesystem-diagnostics'; package = 'codex-exec-server'; binary = 'file_system_windows'; target = @('--test', 'file_system_windows')
              expected_ignored = $false; run_ignored = 'default'
              names = @(
                'file_system_operations_can_reject_junctions_in_any_path_component::local',
                'file_system_operations_can_reject_junctions_in_any_path_component::remote',
                'file_system_private_desktop_survives_helper_exits_and_separates_permissions',
                'shared::file_system_remove_no_follow_removes_file_and_empty_directory::local_sandboxed',
                'shared::file_system_remove_no_follow_removes_file_and_empty_directory::remote_sandboxed',
                'shared::file_system_write_file_writes_bytes::local_sandboxed_no_follow',
                'shared::file_system_write_file_writes_bytes::remote_sandboxed_no_follow',
                'shared::file_system_create_directory_creates_nested_directories::local_sandboxed_no_follow',
                'shared::file_system_create_directory_creates_nested_directories::remote_sandboxed_no_follow',
                'shared::io_error_phase_preserves_kind_code_and_source'
              )
            }
          )
          if ($plans.Count -ne 1 -or ($plans | ForEach-Object { $_.names.Count } | Measure-Object -Sum).Sum -ne 10) { throw 'Expected exactly 10 allowlisted cases in one plan.' }
          ConvertTo-Json -InputObject @($plans) -Depth 8 | Set-Content -LiteralPath (Join-Path $env:PILOT_EVIDENCE 'expected-tests.json') -Encoding utf8
          $nextestVersion = @(& cargo nextest --version)
          if ($LASTEXITCODE -ne 0 -or $nextestVersion.Count -eq 0 -or $nextestVersion[0] -notmatch '^cargo-nextest 0\.9\.143(?:\s|$)') {
            throw 'This pilot requires exactly cargo-nextest 0.9.143.'
          }
          @{
            cargo = (& cargo --version)
            rustc = (& rustc -Vv) -join "`n"
            nextest = $nextestVersion
            capture_helper_sha256 = (Get-FileHash -LiteralPath $captureHelper -Algorithm SHA256).Hash
            v8_archive_sha256 = (Get-FileHash -LiteralPath $env:RUSTY_V8_ARCHIVE -Algorithm SHA256).Hash
            v8_binding_sha256 = (Get-FileHash -LiteralPath $env:RUSTY_V8_SRC_BINDING_PATH -Algorithm SHA256).Hash
            just = (& just --version)
            python = (& python --version)
            ripgrep = @(& rg --version)
            active_toolchain = (& rustup show active-toolchain)
            toolchain_config_sha256 = (Get-FileHash -LiteralPath 'rust-toolchain.toml' -Algorithm SHA256).Hash
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:PILOT_EVIDENCE 'tool-versions.json') -Encoding utf8
          # Build only same-source binaries needed by the selected tests, not a package.
          Save-DiskObservation 'selected-helper-build'
          $helperArguments = @($cargo, 'build', '--locked', '--profile', 'dev-small', '--message-format', 'json',
            '-p', 'codex-cli', '-p', 'codex-code-mode-host', '-p', 'codex-windows-sandbox',
            '--bin', 'codex', '--bin', 'codex-code-mode-host', '--bin', 'codex-windows-sandbox-setup',
            '--bin', 'codex-command-runner', '--bin', 'codex-windows-managed-deny-probe')
          $helper = Invoke-Captured 'helper-build' $helperArguments
          $null = Save-DiagnosticTail (Join-Path $helper.directory 'stderr.log') 'helper-build-stderr'
          if ($helper.exit_code -ne 0 -or $helper.wrapper_exit_code -ne 0 -or -not $helper.capture_complete) { throw 'Selected helper build failed or capture was incomplete.' }
          $helpers = @{}
          foreach ($line in Get-Content -LiteralPath (Join-Path $helper.directory 'stdout.log')) {
            $message = $line | ConvertFrom-Json -AsHashtable
            if ($message['reason'] -eq 'compiler-artifact' -and $message['target']['kind'] -contains 'bin' -and $message['executable']) {
              $helpers[$message['target']['name']] = @{ path = $message['executable']; package_id = $message['package_id'] }
            }
          }
          foreach ($name in @('codex', 'codex-code-mode-host', 'codex-windows-sandbox-setup', 'codex-command-runner', 'codex-windows-managed-deny-probe')) {
            if (-not $helpers.ContainsKey($name)) { throw "Required same-source helper was not built: $name" }
          }
          foreach ($entry in $helpers.GetEnumerator()) {
            foreach ($key in @($entry.Key, $entry.Key.Replace('-', '_')) | Select-Object -Unique) {
              [Environment]::SetEnvironmentVariable("CARGO_BIN_EXE_$key", $entry.Value.path, 'Process')
            }
          }
          $selected = @()
          foreach ($plan in $plans) {
            Save-DiskObservation "list-$($plan.label)"
            # Custom profiles do not inherit junit.path. Use a fresh per-group
            # tool config without modifying the source nextest config.
            $plan.junit = Join-Path $env:PILOT_ROOT "$($plan.label)-junit.xml"
            $nextestConfig = Join-Path $env:PILOT_ROOT "$($plan.label)-nextest.toml"
            @('[profile.local.junit]', ('path = ' + (ConvertTo-Json -InputObject $plan.junit -Compress)),
              'report-skipped = "none"', 'store-success-output = false', 'store-failure-output = false') |
              Set-Content -LiteralPath $nextestConfig -Encoding utf8
            $plan.nextest_config_sha256 = (Get-FileHash -LiteralPath $nextestConfig -Algorithm SHA256).Hash
            $nextestConfigArg = "codex-windows-isolated:$nextestConfig"
            $filter = ($plan.names | ForEach-Object { "test(=$_)"} ) -join ' | '
            $plan.arguments = @('--tool-config-file', $nextestConfigArg, '--profile', 'local', '--locked', '--cargo-profile', 'dev-small', '--run-ignored', $plan.run_ignored, '--ignore-default-filter', '-p', $plan.package) + $plan.target + @('-E', $filter)
            $inventoryStartedUtc = [DateTime]::UtcNow
            $listed = Invoke-Captured "list-$($plan.label)" (@($cargo, 'nextest', 'list') + $plan.arguments + @('--message-format', 'json'))
            $inventoryPath = Join-Path $listed.directory 'stdout.log'
            $null = Save-DiagnosticTail (Join-Path $listed.directory 'stderr.log') "$($plan.label)-compile-stderr"
            if ($listed.exit_code -ne 0 -or $listed.wrapper_exit_code -ne 0 -or -not $listed.capture_complete) { throw "Listing/build failed for $($plan.label); no tests executed." }
            $inventoryFile = Get-Item -LiteralPath $inventoryPath
            if ($inventoryFile.Length -eq 0 -or $inventoryFile.Length -gt 16MB -or $inventoryFile.LastWriteTimeUtc -lt $inventoryStartedUtc) {
              throw 'Inventory is empty, oversized or older than this invocation.'
            }
            $inventory = Get-Content -LiteralPath $inventoryPath -Raw | ConvertFrom-Json -AsHashtable
            $cases = @(Get-SelectedCases $inventory $plan)
            $plan.cases = $cases
            $plan.inventory_sha256 = (Get-FileHash -LiteralPath $inventoryPath -Algorithm SHA256).Hash
            Copy-Item -LiteralPath $inventoryPath -Destination (Join-Path $env:PILOT_EVIDENCE "$($plan.label)-inventory.json")
            $selected += $cases
          }
          if ($selected.Count -ne 10 -or @($selected | Where-Object { $_.ignored }).Count -ne 0) {
            throw 'Expected exactly 10 selected, nonignored diagnostics.'
          }
          Assert-SameCases $selected $selected
          @{ source_sha = $env:SOURCE_SHA; plans = $plans; selected_tests = $selected } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $env:PILOT_EVIDENCE 'selected-tests.json') -Encoding utf8
          $binaryHashes = @{}
          foreach ($path in (@($selected.binary_path) + @($helpers.Values.path) | Sort-Object -Unique)) {
            $targetRoot = [IO.Path]::GetFullPath($env:CARGO_TARGET_DIR).TrimEnd('\') + '\'
            if (-not ([IO.Path]::GetFullPath($path)).StartsWith($targetRoot, [StringComparison]::OrdinalIgnoreCase)) {
              throw 'Test executable escaped this pilot target directory.'
            }
            $binaryHashes[$path] = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
          }
          foreach ($directory in ($selected.binary_path | ForEach-Object { Split-Path -Parent $_ } | Sort-Object -Unique)) {
            $resources = Join-Path $directory 'codex-resources'
            New-Item -ItemType Directory -Path $resources -Force | Out-Null
            foreach ($name in @('codex-windows-sandbox-setup', 'codex-command-runner')) {
              $destination = Join-Path $resources "$name.exe"
              Copy-Item -LiteralPath $helpers[$name].path -Destination $destination
              if ((Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash -ne $binaryHashes[$helpers[$name].path]) {
                throw "Staged helper hash mismatch: $name"
              }
            }
          }
          @{ source_sha = $env:SOURCE_SHA; helpers = $helpers; sha256_by_path = $binaryHashes } |
            ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $env:PILOT_EVIDENCE 'test-binary-hashes.json') -Encoding utf8
          $results = @()
          # just test carries --no-fail-fast. The group and every case are serial;
          # the ignored inherited-baseline countercase is deliberately not selected.
          foreach ($plan in $plans) {
            $result = @{
              group = $plan.label; selected_tests = $plan.cases.Count; exit_code = $null
              expected_ignored = $plan.expected_ignored; run_ignored = $plan.run_ignored
              wrapper_exit_code = $null; capture_complete = $false; native = $null
              receipt_valid = $false; outcome_passed = $false; report = $null; problems = @(); logs = @{}
            }
            $captureDir = Join-Path $env:PILOT_ROOT "native-run-$($plan.label)"
            $startedUtc = $null
            try {
              if (Test-Path -LiteralPath $plan.junit) { throw 'Per-group JUnit path must be fresh.' }
              Save-DiskObservation "run-$($plan.label)"
              $startedUtc = [DateTime]::UtcNow
              $native = Invoke-Captured "run-$($plan.label)" (@($just, 'test') + $plan.arguments +
                @('--test-threads', '1', '--retries', '0', '--failure-output', 'final', '--success-output', 'immediate'))
              $result.native = $native
              $result.exit_code = $native.exit_code
              $result.wrapper_exit_code = $native.wrapper_exit_code
              $result.capture_complete = $native.capture_complete
              # Persist native observation in the event stream before JUnit processing.
              Save-Phase $plan.label 'native-result-retained' 'complete' $result
              $result.report = Read-JUnitReport $plan.label $plan.junit $plan.cases $startedUtc
              $result.receipt_valid = $true
              $result.outcome_passed = ($result.exit_code -eq 0 -and $result.wrapper_exit_code -eq 0 -and $result.capture_complete -and $result.report.passing)
            } catch {
              $result.problems += $_.Exception.Message.Substring(0, [Math]::Min(500, $_.Exception.Message.Length))
              Save-Phase $plan.label 'run-or-validation' 'failed' $result
            } finally {
              # Log/JUnit projection failures do not discard the native receipt
              # or prevent another projection. The native JSON is uploaded directly.
              foreach ($stream in @('stdout', 'stderr')) {
                try {
                  Save-Phase $plan.label "$stream-projection" 'running'
                  $result.logs[$stream] = Save-DiagnosticTail (Join-Path $captureDir "$stream.log") "$($plan.label)-run-$stream"
                } catch { $result.problems += "${stream} projection: $($_.Exception.Message)" }
              }
              try {
                Save-Phase $plan.label 'junit-copy' 'running'
                if ($null -ne $startedUtc -and (Test-Path -LiteralPath $plan.junit -PathType Leaf)) {
                  $reportFile = Get-Item -LiteralPath $plan.junit
                  if ($reportFile.Length -gt 0 -and $reportFile.Length -le 32MB -and $reportFile.LastWriteTimeUtc -ge $startedUtc) {
                    $destination = Join-Path $env:PILOT_EVIDENCE "$($plan.label).xml"
                    Copy-Item -LiteralPath $plan.junit -Destination $destination
                    if ($result.receipt_valid -and (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash -ne $result.report.sha256) {
                      throw 'JUnit changed between validation and retained-copy hashing.'
                    }
                  }
                }
              } catch { $result.problems += "JUnit copy: $($_.Exception.Message)" }
              $results += $result
              Save-Phase $plan.label 'results-write' 'running' $result
              ConvertTo-Json -InputObject @($results) -Depth 12 | Set-Content -LiteralPath (Join-Path $env:PILOT_EVIDENCE 'results.json') -Encoding utf8
              Save-Phase $plan.label 'group-complete' 'complete' $result
            }
          }
          Save-DiskObservation 'after-tests'
          if (@($results | Where-Object { -not $_.receipt_valid -or -not $_.outcome_passed -or $_.problems.Count -gt 0 }).Count) {
            throw 'One or more scoped groups failed, had incomplete native/JUnit receipts, or could not retain reports. Available evidence was retained.'
          }

      - name: Final resource observation
        if: always()
        run: |
          $root = Join-Path $env:RUNNER_TEMP "cwfsprobe-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $evidence = Join-Path $root 'evidence'
          if (Test-Path -LiteralPath $evidence) {
            Get-PSDrive -PSProvider FileSystem | Select-Object Name, Free, Used |
              ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidence 'final-disks.json') -Encoding utf8
            # Recovery projection also runs after a stopped main step. Read a
            # fixed byte snapshot; never wait for pipe EOF or upload raw logs.
            $projections = @()
            foreach ($directory in Get-ChildItem -LiteralPath $root -Directory -Filter 'native-*') {
              foreach ($name in @('stdout', 'stderr')) {
                $source = Join-Path $directory.FullName "$name.log"
                if (-not (Test-Path -LiteralPath $source -PathType Leaf)) { continue }
                $stream = $null
                try {
                  $stream = [IO.File]::Open($source, [IO.FileMode]::Open, [IO.FileAccess]::Read, [IO.FileShare]::ReadWrite)
                  $size = $stream.Length
                  $count = [int][Math]::Min($size, 128KB)
                  [void]$stream.Seek($size - $count, [IO.SeekOrigin]::Begin)
                  $bytes = [byte[]]::new($count)
                  $read = 0
                  while ($read -lt $count) {
                    $next = $stream.Read($bytes, $read, $count - $read)
                    if ($next -eq 0) { break }
                    $read += $next
                  }
                  $retained = [byte[]]::new($read)
                  [Array]::Copy($bytes, $retained, $read)
                  [IO.File]::WriteAllBytes((Join-Path $evidence "$($directory.Name)-$name-tail.txt"), $retained)
                  $projections += @{ native = $directory.Name; stream = $name; status = 'retained'; snapshot_bytes = $size; retained_bytes = $read; truncated = ($size -gt $read); completeness = 'snapshot-only; descendant completion not established' }
                } catch {
                  $problem = $_.Exception.Message
                  $projections += @{ native = $directory.Name; stream = $name; status = 'failed'; problem = $problem.Substring(0, [Math]::Min(500, $problem.Length)) }
                } finally { if ($null -ne $stream) { $stream.Dispose() } }
              }
            }
            $projections | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $evidence 'final-projections.json') -Encoding utf8
          }
          # No global uninstall or broad host cleanup: the GitHub VM is discarded.
          # No test homes, .sandbox-secrets, profiles, config or credentials are retained.

      - name: Retain only qualification evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: windows-filesystem-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cwfsprobe-${{ github.run_id }}-${{ github.run_attempt }}/native-*/native-result.json
            ${{ runner.temp }}/cwfsprobe-${{ github.run_id }}-${{ github.run_attempt }}/native-*/capture-phase.json
            ${{ runner.temp }}/cwfsprobe-${{ github.run_id }}-${{ github.run_attempt }}/evidence/*.json
            ${{ runner.temp }}/cwfsprobe-${{ github.run_id }}-${{ github.run_attempt }}/evidence/*.jsonl
            ${{ runner.temp }}/cwfsprobe-${{ github.run_id }}-${{ github.run_attempt }}/evidence/*.xml
            ${{ runner.temp }}/cwfsprobe-${{ github.run_id }}-${{ github.run_attempt }}/evidence/*-tail.txt
          retention-days: 1
          if-no-files-found: warn
