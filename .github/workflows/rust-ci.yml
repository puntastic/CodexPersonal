# THROWAWAY PURPOSE-BRANCH PILOT ONLY. Do not merge this replacement into main.
# Reuses the existing workflow ID/path for dispatch with ref=codex/windows-isolated-tests-20261017.
# Production code is checked out at SOURCE_SHA; the workflow revision is recorded separately.
name: Windows three-case token access matrix

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-token-access-matrix-three
  cancel-in-progress: false

jobs:
  qualify-token-access-matrix:
    if: >-
      github.repository == 'puntastic/CodexPersonal' &&
      github.ref == 'refs/heads/codex/windows-isolated-tests-20261017' &&
      github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    env:
      # Exact reviewed, compiled test-only source; production policy is unchanged.
      SOURCE_SHA: 9a37d8ddb47178d4d75dd7acc84349e9bf962238
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      RUST_MIN_STACK: "8388608"
      NEXTEST_PROFILE: local

    steps:
      - name: Check out only the qualified source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify disposable host and establish private run directories
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:RUNNER_OS -ne 'Windows') {
            throw 'This pilot must run only on a disposable GitHub-hosted Windows VM.'
          }
          $principal = [Security.Principal.WindowsPrincipal]::new([Security.Principal.WindowsIdentity]::GetCurrent())
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'The isolated sandbox tests require an elevated unattended runner.'
          }
          foreach ($name in @('CodexSandboxOffline', 'CodexSandboxOnline')) {
            if (Get-LocalUser -Name $name -ErrorAction SilentlyContinue) {
              throw "Unexpected pre-existing sandbox account: $name"
            }
          }
          if (Get-LocalGroup -Name 'CodexSandboxUsers' -ErrorAction SilentlyContinue) {
            throw 'Unexpected pre-existing sandbox group.'
          }
          $head = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:SOURCE_SHA) { throw 'Source SHA mismatch.' }
          $root = Join-Path $env:RUNNER_TEMP "cwtokenmatrix3-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $root) { throw 'Pilot output root must be new.' }
          foreach ($child in @('target', 'test-tmp', 'evidence')) {
            New-Item -ItemType Directory -Path (Join-Path $root $child) | Out-Null
          }
          $evidence = Join-Path $root 'evidence'
          @{
            source_sha = $head
            workflow_sha = $env:GITHUB_SHA
            workflow_ref = $env:GITHUB_WORKFLOW_REF
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            image_os = $env:ImageOS
            image_version = $env:ImageVersion
            runner_arch = $env:RUNNER_ARCH
            host_os_version = [Environment]::OSVersion.VersionString
            sandbox_accounts_initially_absent = $true
            cleanup_boundary = 'Token handles and in-memory security descriptors are test-local on this disposable VM. No file-ACL mutation, child workload process, sandbox account setup or global uninstall is selected; the VM is discarded.'
            proof_boundary = 'Exactly three native token/AccessCheck library cases: one synthetic descriptor/flags/SID-set matrix and two existing token regressions. These are not file-operation, child-launch, live-policy, desktop or sandbox-remediation results. No production WRSID policy change, canonical package, Core, V8, workspace campaign, installation, credentials or settings changes.'
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidence 'provenance.json') -Encoding utf8
          @{
            PILOT_ROOT = $root
            PILOT_EVIDENCE = $evidence
            CARGO_TARGET_DIR = (Join-Path $root 'target')
            CODEX_REPO_ROOT = $env:GITHUB_WORKSPACE
            TEST_TMPDIR = (Join-Path $root 'test-tmp')
            TEMP = (Join-Path $root 'test-tmp')
            TMP = (Join-Path $root 'test-tmp')
          }.GetEnumerator() | ForEach-Object { "$($_.Key)=$($_.Value)" >> $env:GITHUB_ENV }
          # Do not invoke setup-ci: its Dev Drive/VHD provisioning is outside this small pilot.
          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name, Free, Used |
            ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidence 'initial-disks.json') -Encoding utf8

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: "1.95.0"
          targets: x86_64-pc-windows-msvc

      - name: Select Python for the existing build adapters
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          architecture: x64

      - name: Expose the existing MSVC x64 SDK
        uses: ./.github/actions/setup-msvc-env
        with:
          target: x86_64-pc-windows-msvc

      - name: Install pinned just
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: just@1.51.0

      - name: Install pinned nextest
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest@0.9.143

      - name: Build, verify the exact selection, then qualify serially
        working-directory: codex-rs
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          foreach ($name in @('RUNFILES_MANIFEST_ONLY', 'CODEX_WINDOWS_REGISTERED_CORE')) {
            # A null method argument can leave an empty-but-present marker in pwsh.
            Remove-Item -LiteralPath "Env:$name" -ErrorAction SilentlyContinue
            if ([Environment]::GetEnvironmentVariables('Process').Contains($name)) {
              throw "Inherited environment marker is still present: $name"
            }
          }
          function Save-DiskObservation([string]$Phase) {
            $drive = [IO.DriveInfo]::new([IO.Path]::GetPathRoot($env:CARGO_TARGET_DIR))
            @{
              phase = $Phase
              utc = [DateTime]::UtcNow.ToString('o')
              available_bytes = $drive.AvailableFreeSpace
              total_bytes = $drive.TotalSize
            } | ConvertTo-Json -Compress | Add-Content -LiteralPath (Join-Path $env:PILOT_EVIDENCE 'disk-observations.jsonl')
            if ($drive.AvailableFreeSpace -lt 2GB) { throw "Less than 2 GiB free before $Phase; resource pilot stopped." }
          }
          # Retain bounded run context; matrix rows also have an independent 64 KiB projection.
          # 512 lines, at most 32 Ki characters per line; no fixture directories.
          function Save-DiagnosticTail([string]$Source, [string]$Name) {
            if (Test-Path -LiteralPath $Source) {
              Get-Content -LiteralPath $Source -Tail 512 |
                ForEach-Object { if ($_.Length -gt 32768) { $_.Substring(0, 32768) } else { $_ } } |
                Set-Content -LiteralPath (Join-Path $env:PILOT_EVIDENCE "$Name.txt") -Encoding utf8
            }
          }
          function Save-MatrixReadback([string]$Source) {
            $limit = 64KB
            $text = [Text.StringBuilder]::new()
            $retained = 0
            $bytes = 0
            $truncated = $false
            if (Test-Path -LiteralPath $Source) {
              # Worker emits one fixed-prefix line for each synthetic matrix row.
              $rows = @(Select-String -LiteralPath $Source -Pattern '^\s*TOKEN-MATRIX\b' | Select-Object -First 257)
              foreach ($row in $rows) {
                $line = $row.Line + [Environment]::NewLine
                $lineBytes = [Text.Encoding]::UTF8.GetByteCount($line)
                if ($retained -eq 256 -or $bytes + $lineBytes -gt $limit - 128) {
                  $truncated = $true
                  break
                }
                [void]$text.Append($line)
                $bytes += $lineBytes
                $retained++
              }
            }
            if ($truncated) { [void]$text.AppendLine('TOKEN-MATRIX-RETENTION truncated=true') }
            $text.ToString() | Set-Content -LiteralPath (Join-Path $env:PILOT_EVIDENCE 'matrix-readback-tail.txt') -Encoding utf8
            return @{ rows_retained = $retained; truncated = $truncated; byte_limit = $limit; row_limit = 256 }
          }
          function Get-SelectedCases([hashtable]$Inventory, [hashtable]$Plan) {
            if (-not $Inventory.ContainsKey('rust-suites')) { throw 'Unsupported nextest inventory.' }
            $actual = @()
            foreach ($suite in $Inventory['rust-suites'].Values) {
              if ($suite['status'] -ne 'listed') { continue }
              foreach ($case in $suite['testcases'].GetEnumerator()) {
                if ($case.Value['filter-match']['status'] -ne 'matches') { continue }
                if ($suite['package-name'] -ne $Plan.package -or $suite['binary-name'] -ne $Plan.binary -or
                    $suite['binary-id'] -isnot [string] -or [string]::IsNullOrWhiteSpace($suite['binary-id']) -or
                    $case.Value['ignored'] -isnot [bool] -or $case.Value['ignored']) {
                  throw 'Unexpected package/binary, unsupported inventory or ignored case selected.'
                }
                $actual += @{ package = $suite['package-name']; binary = $suite['binary-name']; binary_id = $suite['binary-id']; test = $case.Key; binary_path = $suite['binary-path'] }
              }
            }
            if ($actual.Count -ne $Plan.names.Count -or
                @(Compare-Object ($Plan.names | Sort-Object) ($actual.test | Sort-Object)).Count -ne 0) {
              throw "Selected test names differ from the exact allowlist for $($Plan.label); no tests executed."
            }
            return $actual
          }
          function Get-CaseKey($Case) {
            ConvertTo-Json -InputObject @($Case.binary_id, $Case.test) -Compress
          }
          function Assert-SameCases($Expected, $Actual) {
            $left = @($Expected | ForEach-Object { Get-CaseKey $_ } | Sort-Object)
            $right = @($Actual | ForEach-Object { Get-CaseKey $_ } | Sort-Object)
            if ($left.Count -ne $right.Count -or $right.Count -ne @($right | Select-Object -Unique).Count -or
                @(Compare-Object $left $right).Count -ne 0) { throw 'Case identity sets differ or contain duplicates.' }
          }
          function Read-JUnitReport([string]$Path, $Expected, [DateTime]$StartedUtc) {
            $file = Get-Item -LiteralPath $Path -ErrorAction Stop
            if ($file.PSIsContainer -or $file.Length -eq 0 -or $file.Length -gt 32MB -or $file.LastWriteTimeUtc -lt $StartedUtc) {
              throw 'JUnit is empty, oversized or older than this invocation.'
            }
            $settings = [Xml.XmlReaderSettings]::new()
            $settings.DtdProcessing = [Xml.DtdProcessing]::Prohibit
            $settings.XmlResolver = $null
            $document = [Xml.XmlDocument]::new()
            $document.XmlResolver = $null
            $reader = [Xml.XmlReader]::Create($file.FullName, $settings)
            try { $document.Load($reader) } finally { $reader.Dispose() }
            $cases = @($document.SelectNodes('/testsuites/testsuite/testcase'))
            if ($document.DocumentElement.get_Name() -ne 'testsuites' -or
                $document.SelectNodes('//testcase').Count -ne $cases.Count) { throw 'Unexpected JUnit structure.' }
            $actual = @($cases | ForEach-Object { @{ binary_id = $_.GetAttribute('classname'); test = $_.GetAttribute('name') } })
            Assert-SameCases $Expected $actual
            foreach ($node in $document.SelectNodes('/testsuites | /testsuites/testsuite')) {
              foreach ($counter in @('tests', 'failures', 'errors')) {
                if (-not $node.HasAttribute($counter) -or $node.GetAttribute($counter) -notmatch '^\d+$') {
                  throw 'JUnit required counters missing or invalid.'
                }
              }
              foreach ($entry in @{ tests = './/testcase'; failures = './/testcase[failure]'; errors = './/testcase[error]'; skipped = './/testcase[skipped]' }.GetEnumerator()) {
                if ($node.HasAttribute($entry.Key)) {
                  if ($node.GetAttribute($entry.Key) -notmatch '^\d+$' -or
                      [long]$node.GetAttribute($entry.Key) -ne $node.SelectNodes($entry.Value).Count) {
                    throw "JUnit $($entry.Key) counter disagrees with actual cases."
                  }
                } elseif ($node.SelectNodes($entry.Value).Count -ne 0) { throw 'JUnit omitted a nonzero counter.' }
              }
            }
            $failures = $document.SelectNodes('//testcase[failure]').Count
            $errors = $document.SelectNodes('//testcase[error]').Count
            $skipped = $document.SelectNodes('//testcase[skipped]').Count
            $retries = $document.SelectNodes('//flakyFailure | //flakyError | //rerunFailure | //rerunError').Count
            # Failed tests are valid observations, not malformed receipts.
            return @{
              tests = $cases.Count; failures = $failures; errors = $errors; skipped = $skipped; retries = $retries
              passing = ($failures + $errors + $skipped + $retries -eq 0)
              sha256 = (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash
            }
          }
          $plans = @(
            @{
              label = 'token-access-matrix'; package = 'codex-windows-sandbox'; binary = 'codex_windows_sandbox'; target = @('--lib')
              names = @(
                'token::tests::legacy_restriction_flags_and_sid_sets_access_matrix',
                'token::tests::elevated_token_includes_network_proxy_restricting_sid',
                'token::tests::default_objects_deny_other_logons_even_with_the_same_owner'
              )
            }
          )
          $plans | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $env:PILOT_EVIDENCE 'expected-tests.json') -Encoding utf8
          $nextestVersion = @(& cargo nextest --version)
          if ($LASTEXITCODE -ne 0 -or $nextestVersion.Count -eq 0 -or $nextestVersion[0] -notmatch '^cargo-nextest 0\.9\.143(?:\s|$)') {
            throw 'This pilot requires exactly cargo-nextest 0.9.143.'
          }
          # Custom profiles do not inherit junit.path. Supply an explicit CI-only
          # report path without modifying the source checkout's nextest config.
          $junit = Join-Path $env:PILOT_ROOT 'junit.xml'
          $nextestConfig = Join-Path $env:PILOT_ROOT 'nextest-ci.toml'
          @(
            '[profile.local.junit]'
            ('path = ' + (ConvertTo-Json -InputObject $junit -Compress))
            'report-skipped = "none"'
            'store-success-output = false'
            'store-failure-output = false'
          ) | Set-Content -LiteralPath $nextestConfig -Encoding utf8
          $nextestConfigArg = "codex-windows-isolated:$nextestConfig"
          @{
            cargo = (& cargo --version)
            rustc = (& rustc -Vv) -join "`n"
            nextest = $nextestVersion
            nextest_tool_config_sha256 = (Get-FileHash -LiteralPath $nextestConfig -Algorithm SHA256).Hash
            junit_path = $junit
            just = (& just --version)
            python = (& python --version)
            active_toolchain = (& rustup show active-toolchain)
            toolchain_config_sha256 = (Get-FileHash -LiteralPath 'rust-toolchain.toml' -Algorithm SHA256).Hash
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:PILOT_EVIDENCE 'tool-versions.json') -Encoding utf8
          # Only this library's token/AccessCheck tests are selected. No helper
          # binaries, file ACL changes, child workloads or account setup are needed.
          $selected = @()
          foreach ($plan in $plans) {
            Save-DiskObservation "list-$($plan.label)"
            $filter = ($plan.names | ForEach-Object { "test(=$_)"} ) -join ' | '
            $plan.arguments = @('--tool-config-file', $nextestConfigArg, '--profile', 'local', '--locked', '--cargo-profile', 'dev-small', '--run-ignored', 'default', '--ignore-default-filter', '-p', $plan.package) + $plan.target + @('-E', $filter)
            $inventoryPath = Join-Path $env:PILOT_ROOT "$($plan.label)-inventory.json"
            $listLog = Join-Path $env:PILOT_ROOT "$($plan.label)-list.log"
            $inventoryStartedUtc = [DateTime]::UtcNow
            & cargo nextest list @($plan.arguments) --message-format json 1> $inventoryPath 2> $listLog
            $listExit = $LASTEXITCODE
            Save-DiagnosticTail $listLog "$($plan.label)-compile-tail"
            if ($listExit -ne 0) { throw "Listing/build failed for $($plan.label); no tests executed." }
            $inventoryFile = Get-Item -LiteralPath $inventoryPath
            if ($inventoryFile.Length -eq 0 -or $inventoryFile.Length -gt 16MB -or $inventoryFile.LastWriteTimeUtc -lt $inventoryStartedUtc) {
              throw 'Inventory is empty, oversized or older than this invocation.'
            }
            $inventory = Get-Content -LiteralPath $inventoryPath -Raw | ConvertFrom-Json -AsHashtable
            $cases = @(Get-SelectedCases $inventory $plan)
            $plan.cases = $cases
            $plan.inventory_sha256 = (Get-FileHash -LiteralPath $inventoryPath -Algorithm SHA256).Hash
            Copy-Item -LiteralPath $inventoryPath -Destination (Join-Path $env:PILOT_EVIDENCE "$($plan.label)-inventory.json")
            $selected += $cases
          }
          if ($selected.Count -ne 3) { throw 'Expected exactly three selected, nonignored tests.' }
          @{ source_sha = $env:SOURCE_SHA; plans = $plans; selected_tests = $selected } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $env:PILOT_EVIDENCE 'selected-tests.json') -Encoding utf8
          $binaryHashes = @{}
          foreach ($path in ($selected.binary_path | Sort-Object -Unique)) {
            $targetRoot = [IO.Path]::GetFullPath($env:CARGO_TARGET_DIR).TrimEnd('\') + '\'
            if (-not ([IO.Path]::GetFullPath($path)).StartsWith($targetRoot, [StringComparison]::OrdinalIgnoreCase)) {
              throw 'Test executable escaped this pilot target directory.'
            }
            $binaryHashes[$path] = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
          }
          $binaryHashes | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:PILOT_EVIDENCE 'test-binary-hashes.json') -Encoding utf8
          $results = @()
          # just test carries --no-fail-fast; all three cases run serially.
          foreach ($plan in $plans) {
            $result = @{
              group = $plan.label; selected_tests = $plan.cases.Count; exit_code = $null
              receipt_valid = $false; outcome_passed = $false; report = $null; problem = $null; matrix = $null
            }
            $log = Join-Path $env:PILOT_ROOT "$($plan.label)-run.log"
            $startedUtc = $null
            try {
              if (Test-Path -LiteralPath $junit) { Remove-Item -LiteralPath $junit }
              Save-DiskObservation "run-$($plan.label)"
              $startedUtc = [DateTime]::UtcNow
              & just test @($plan.arguments) --test-threads 1 --retries 0 --failure-output final --success-output immediate 1> $log 2>&1
              $result.exit_code = $LASTEXITCODE
              $result.report = Read-JUnitReport $junit $plan.cases $startedUtc
              $result.receipt_valid = $true
              $result.outcome_passed = ($result.exit_code -eq 0 -and $result.report.passing)
            } catch {
              $result.problem = $_.Exception.Message.Substring(0, [Math]::Min(500, $_.Exception.Message.Length))
            } finally {
              Save-DiagnosticTail $log "$($plan.label)-run-tail"
              $result.matrix = Save-MatrixReadback $log
              if ($null -ne $startedUtc -and (Test-Path -LiteralPath $junit -PathType Leaf)) {
                $reportFile = Get-Item -LiteralPath $junit
                if ($reportFile.Length -le 32MB -and $reportFile.LastWriteTimeUtc -ge $startedUtc) {
                  Copy-Item -LiteralPath $junit -Destination (Join-Path $env:PILOT_EVIDENCE "$($plan.label).xml") -Force
                }
              }
              $results += $result
              $results | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $env:PILOT_EVIDENCE 'results.json') -Encoding utf8
            }
          }
          Save-DiskObservation 'after-tests'
          if (@($results | Where-Object { -not $_.receipt_valid -or -not $_.outcome_passed -or $_.matrix.rows_retained -eq 0 -or $_.matrix.truncated }).Count) {
            throw 'A token test failed, its receipt was incomplete, or the bounded matrix output was missing/truncated. Available evidence was retained.'
          }

      - name: Final resource observation
        if: always()
        run: |
          $root = Join-Path $env:RUNNER_TEMP "cwtokenmatrix3-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $evidence = Join-Path $root 'evidence'
          if (Test-Path -LiteralPath $evidence) {
            Get-PSDrive -PSProvider FileSystem | Select-Object Name, Free, Used |
              ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidence 'final-disks.json') -Encoding utf8
          }
          # No global uninstall or broad host cleanup: the GitHub VM is discarded.
          # No test homes, .sandbox-secrets, profiles, config or credentials are retained.

      - name: Retain only qualification evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: windows-isolated-token-matrix-three-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cwtokenmatrix3-${{ github.run_id }}-${{ github.run_attempt }}/evidence/*.json
            ${{ runner.temp }}/cwtokenmatrix3-${{ github.run_id }}-${{ github.run_attempt }}/evidence/*.jsonl
            ${{ runner.temp }}/cwtokenmatrix3-${{ github.run_id }}-${{ github.run_attempt }}/evidence/*.xml
            ${{ runner.temp }}/cwtokenmatrix3-${{ github.run_id }}-${{ github.run_attempt }}/evidence/*-tail.txt
          retention-days: 1
          if-no-files-found: warn
