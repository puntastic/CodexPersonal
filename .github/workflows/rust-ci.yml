# THROWAWAY PURPOSE-BRANCH PILOT ONLY. Do not merge this replacement into main.
# Reuses the existing workflow ID/path for dispatch with ref=codex/windows-isolated-tests-20261017.
# Production code is checked out at SOURCE_SHA; the workflow revision is recorded separately.
name: Windows supported workspace qualification candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-isolated-sandbox-qualification-pilot
  cancel-in-progress: false

jobs:
  qualify-supported-workspace:
    if: >-
      github.repository == 'puntastic/CodexPersonal' &&
      github.ref == 'refs/heads/codex/windows-isolated-tests-20261017' &&
      github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    env:
      # Exact source checkpoint after full formatting and scoped Core/Guardian/Windows lint.
      SOURCE_SHA: 988f24639c26960426cea0de51f90c81b407f47d
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      RUST_MIN_STACK: "8388608"
      NEXTEST_PROFILE: local

    steps:
      - name: Check out only the qualified source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify disposable host and establish private run directories
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:RUNNER_OS -ne 'Windows') {
            throw 'This pilot must run only on a disposable GitHub-hosted Windows VM.'
          }
          $principal = [Security.Principal.WindowsPrincipal]::new([Security.Principal.WindowsIdentity]::GetCurrent())
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'The isolated sandbox tests require an elevated unattended runner.'
          }
          foreach ($name in @('CodexSandboxOffline', 'CodexSandboxOnline')) {
            if (Get-LocalUser -Name $name -ErrorAction SilentlyContinue) {
              throw "Unexpected pre-existing sandbox account: $name"
            }
          }
          if (Get-LocalGroup -Name 'CodexSandboxUsers' -ErrorAction SilentlyContinue) {
            throw 'Unexpected pre-existing sandbox group.'
          }
          # The selected PowerShell fixtures otherwise return early and look passed.
          $powerShell = Join-Path $env:ProgramFiles 'PowerShell/7/pwsh.exe'
          if (-not (Test-Path -LiteralPath $powerShell -PathType Leaf)) {
            throw 'The exact PowerShell 7 path used by the native legacy fixtures is required.'
          }
          $head = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:SOURCE_SHA) { throw 'Source SHA mismatch.' }
          $root = Join-Path $env:RUNNER_TEMP "cwspace-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $root) { throw 'Pilot output root must be new.' }
          foreach ($child in @('target', 'test-tmp', 'evidence')) {
            New-Item -ItemType Directory -Path (Join-Path $root $child) | Out-Null
          }
          $evidence = Join-Path $root 'evidence'
          @{
            source_sha = $head
            workflow_sha = $env:GITHUB_SHA
            workflow_ref = $env:GITHUB_WORKFLOW_REF
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            image_os = $env:ImageOS
            image_version = $env:ImageVersion
            runner_arch = $env:RUNNER_ARCH
            host_os_version = [Environment]::OSVersion.VersionString
            powershell_fixture_path = $powerShell
            powershell_fixture_sha256 = (Get-FileHash -LiteralPath $powerShell -Algorithm SHA256).Hash
            sandbox_accounts_initially_absent = $true
            cleanup_boundary = 'Task data and test-path ACL/desktop effects stay on this disposable VM. No extra account provisioning or global uninstall is run; the VM is discarded.'
            proof_boundary = 'All freshly inventoried supported Windows workspace nonignored tests, excluding only codex-voice-host because its matching native SDK is absent. Ordinary complement first, then exactly eleven account-mutating cases in serial groups. Windows 2025 x64 only, not other platforms or local Windows 10. Ignored/cfg-excluded tests and voice runtime remain unqualified. Candidate package is NOT DEPLOYED and NOT APPROVED; test failures remain failures.'
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidence 'provenance.json') -Encoding utf8
          @{
            PILOT_ROOT = $root
            PILOT_EVIDENCE = $evidence
            CARGO_TARGET_DIR = (Join-Path $root 'target')
            CODEX_REPO_ROOT = $env:GITHUB_WORKSPACE
            TEST_TMPDIR = (Join-Path $root 'test-tmp')
            TEMP = (Join-Path $root 'test-tmp')
            TMP = (Join-Path $root 'test-tmp')
          }.GetEnumerator() | ForEach-Object { "$($_.Key)=$($_.Value)" >> $env:GITHUB_ENV }
          # Do not invoke setup-ci: its Dev Drive/VHD provisioning is outside this campaign.
          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name, Free, Used |
            ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidence 'initial-disks.json') -Encoding utf8

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: "1.95.0"
          targets: x86_64-pc-windows-msvc

      - name: Select Python for the existing build adapters
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          architecture: x64

      - name: Expose the existing MSVC x64 SDK
        uses: ./.github/actions/setup-msvc-env
        with:
          target: x86_64-pc-windows-msvc

      - name: Configure checksum-verified V8 inputs from the pinned source
        id: rusty_v8
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-pc-windows-msvc

      - name: Install pinned just
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: just@1.51.0

      - name: Install pinned nextest
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest@0.9.143

      - name: Install pinned ripgrep for the canonical package
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: ripgrep@14.1.1

      - name: Install existing workspace DotSlash prerequisite
        uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2

      - name: Expose DotSlash at the Windows fixture lookup path
        run: |
          $directory = Join-Path $env:LOCALAPPDATA 'Microsoft/WindowsApps'
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          Copy-Item -LiteralPath (Get-Command dotslash).Source -Destination (Join-Path $directory 'dotslash.exe')

      - name: Build canonical candidate before tests - NOT DEPLOYED or APPROVED
        id: candidate
        continue-on-error: true
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $env:CODEX_THREAD_ID = "windows-ci-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $candidate = Join-Path $env:PILOT_ROOT 'candidate-package'
          $cargo = (Get-Command cargo).Source
          $cargoHome = Split-Path -Parent (Split-Path -Parent $cargo)
          $rustupHome = (& rustup show home).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Unable to resolve the CI Rustup home.' }
          $drive = [IO.DriveInfo]::new([IO.Path]::GetPathRoot($env:CARGO_TARGET_DIR))
          if ($drive.AvailableFreeSpace -lt 10GB) { throw 'Less than 10 GiB free before canonical package build.' }
          $buildArguments = @{
            Action = 'Build'; CargoProfile = 'dev-small'; PackageDirectory = $candidate
            CargoPath = $cargo; CargoHome = $cargoHome; RustupHome = $rustupHome
            PythonPath = (Get-Command python).Source; RipgrepPath = (Get-Command rg).Source; Json = $true
          }
          # Existing Build supplies locked native-host builds, source receipts,
          # package validation and isolated --version smokes. Never call Deploy.
          $resultText = & ./codex-dev.ps1 @buildArguments
          $resultText | Set-Content -LiteralPath (Join-Path $env:PILOT_EVIDENCE 'canonical-build-result.json') -Encoding utf8
          $result = ($resultText -join [Environment]::NewLine) | ConvertFrom-Json
          $provenancePath = Join-Path $candidate 'codex-dev-build.json'
          $provenance = Get-Content -LiteralPath $provenancePath -Raw | ConvertFrom-Json
          if ($result.Status -ne 'built' -or $provenance.Status -ne 'stable' -or
              $provenance.SourceBefore.Head -ne $env:SOURCE_SHA -or $provenance.SourceAfter.Head -ne $env:SOURCE_SHA -or
              $provenance.SourceBefore.Dirty -or $provenance.SourceAfter.Dirty -or
              -not $provenance.CargoLocked -or $provenance.CargoProfile -ne 'dev-small' -or
              -not (Test-Path -LiteralPath $result.Receipt -PathType Leaf)) {
            throw 'Canonical candidate lacks a clean exact-source stable Build receipt.'
          }
          $receipt = Get-Content -LiteralPath $result.Receipt -Raw | ConvertFrom-Json
          if ($receipt.Action -ne 'Build' -or -not $receipt.Details.SourceStable -or
              $receipt.Details.Package.Provenance.BuildId -ne $provenance.BuildId) { throw 'Build receipt identity mismatch.' }
          Copy-Item -LiteralPath $provenancePath -Destination (Join-Path $env:PILOT_EVIDENCE 'canonical-build-provenance.json')
          Copy-Item -LiteralPath $result.Receipt -Destination (Join-Path $env:PILOT_EVIDENCE 'canonical-build-receipt.json')
          $files = @(Get-ChildItem -LiteralPath $candidate -File -Recurse | ForEach-Object {
            @{ path = [IO.Path]::GetRelativePath($candidate, $_.FullName); bytes = $_.Length; sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash }
          })
          @{
            status = 'NOT DEPLOYED / NOT APPROVED'; source_sha = $env:SOURCE_SHA
            build_id = $provenance.BuildId; artifact_fingerprint = $provenance.ArtifactFingerprint
            cargo_target_dir = $env:CARGO_TARGET_DIR; build_arguments = $buildArguments
            build_jobs = $env:CARGO_BUILD_JOBS; incremental = $env:CARGO_INCREMENTAL
            proof_limit = 'Version smoke only. Workspace tests may rebuild executables with unified features; same source does not prove packaged-byte execution.'
            files = $files
          } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $env:PILOT_EVIDENCE 'candidate-package.json') -Encoding utf8

      - name: Retain immutable unapproved candidate before test execution
        if: steps.candidate.outcome == 'success'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: NOT-DEPLOYED-NOT-APPROVED-windows-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cwspace-${{ github.run_id }}-${{ github.run_attempt }}/candidate-package/
          retention-days: 1
          if-no-files-found: error

      - name: Build helpers, inventory the supported workspace, and run all groups
        id: qualification
        working-directory: codex-rs
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          foreach ($name in @('RUNFILES_MANIFEST_ONLY', 'CODEX_WINDOWS_REGISTERED_CORE')) {
            Remove-Item -LiteralPath "Env:$name" -ErrorAction SilentlyContinue
            if ([Environment]::GetEnvironmentVariables('Process').Contains($name)) { throw "Inherited marker still present: $name" }
          }
          function Save-DiskObservation([string]$Phase) {
            $drive = [IO.DriveInfo]::new([IO.Path]::GetPathRoot($env:CARGO_TARGET_DIR))
            @{
              phase = $Phase
              utc = [DateTime]::UtcNow.ToString('o')
              available_bytes = $drive.AvailableFreeSpace
              total_bytes = $drive.TotalSize
            } | ConvertTo-Json -Compress | Add-Content -LiteralPath (Join-Path $env:PILOT_EVIDENCE 'disk-observations.jsonl')
            if ($drive.AvailableFreeSpace -lt 2GB) { throw "Less than 2 GiB free before $Phase; resource pilot stopped." }
          }
          function Save-DiagnosticTail([string]$Source, [string]$Name) {
            if (Test-Path -LiteralPath $Source) {
              Get-Content -LiteralPath $Source -Tail 200 |
                ForEach-Object { if ($_.Length -gt 4096) { $_.Substring(0, 4096) } else { $_ } } |
                Set-Content -LiteralPath (Join-Path $env:PILOT_EVIDENCE "$Name.txt") -Encoding utf8
            }
          }
          function Get-CaseKey($Case) {
            ConvertTo-Json -InputObject @($Case.binary_id, $Case.test) -Compress
          }
          function Assert-SameCases($Expected, $Actual) {
            $left = @($Expected | ForEach-Object { Get-CaseKey $_ } | Sort-Object)
            $right = @($Actual | ForEach-Object { Get-CaseKey $_ } | Sort-Object)
            if ($left.Count -ne $right.Count -or $right.Count -ne @($right | Select-Object -Unique).Count -or
                @(Compare-Object $left $right).Count -ne 0) { throw 'Case identity sets differ or contain duplicates.' }
          }
          function Read-Inventory([string]$Path, [switch]$Full) {
            $file = Get-Item -LiteralPath $Path
            if ($file.Length -eq 0 -or $file.Length -gt 64MB) { throw 'Inventory is empty or exceeds the 64 MiB bound.' }
            $inventory = Get-Content -LiteralPath $Path -Raw | ConvertFrom-Json -AsHashtable
            if (-not $inventory.ContainsKey('rust-suites')) { throw 'Unsupported nextest inventory.' }
            $selected = @(); $ignored = @(); $listedCount = 0
            foreach ($suite in $inventory['rust-suites'].Values) {
              if ($suite['status'] -ne 'listed') {
                if ($Full) { throw 'Full workspace inventory contains an unlisted suite.' }
                continue
              }
              if ($suite['package-name'] -eq 'codex-voice-host' -or
                  $suite['binary-id'] -isnot [string] -or [string]::IsNullOrWhiteSpace($suite['binary-id'])) {
                throw 'Unexpected excluded package or missing binary ID.'
              }
              foreach ($case in $suite['testcases'].GetEnumerator()) {
                $listedCount++
                if ($case.Value['ignored'] -isnot [bool]) { throw 'Missing inventory ignored state.' }
                $item = @{
                  package = $suite['package-name']; binary = $suite['binary-name']; binary_id = $suite['binary-id']
                  test = $case.Key; binary_path = $suite['binary-path']; ignored = $case.Value['ignored']
                }
                if ($case.Value['ignored']) { $ignored += $item; continue }
                if ($case.Value['filter-match']['status'] -eq 'matches') { $selected += $item }
                elseif ($Full) { throw 'Nonignored case filtered out of the full workspace inventory.' }
              }
            }
            if ($Full -and $listedCount -ne $inventory['test-count']) { throw 'Full inventory test count is inconsistent.' }
            if ($selected.Count -eq 0) { throw 'No nonignored tests selected.' }
            return @{ selected = $selected; ignored = $ignored; listed = $listedCount }
          }
          function Read-JUnitReport([string]$Path, $Expected, [DateTime]$StartedUtc) {
            $file = Get-Item -LiteralPath $Path -ErrorAction Stop
            if ($file.PSIsContainer -or $file.Length -eq 0 -or $file.Length -gt 32MB -or $file.LastWriteTimeUtc -lt $StartedUtc) {
              throw 'JUnit is empty, oversized or older than this invocation.'
            }
            $settings = [Xml.XmlReaderSettings]::new()
            $settings.DtdProcessing = [Xml.DtdProcessing]::Prohibit
            $settings.XmlResolver = $null
            $document = [Xml.XmlDocument]::new()
            $document.XmlResolver = $null
            $reader = [Xml.XmlReader]::Create($file.FullName, $settings)
            try { $document.Load($reader) } finally { $reader.Dispose() }
            $cases = @($document.SelectNodes('/testsuites/testsuite/testcase'))
            if ($document.DocumentElement.get_Name() -ne 'testsuites' -or
                $document.SelectNodes('//testcase').Count -ne $cases.Count) { throw 'Unexpected JUnit structure.' }
            $actual = @($cases | ForEach-Object { @{ binary_id = $_.GetAttribute('classname'); test = $_.GetAttribute('name') } })
            Assert-SameCases $Expected $actual
            foreach ($node in $document.SelectNodes('/testsuites | /testsuites/testsuite')) {
              foreach ($counter in @('tests', 'failures', 'errors')) {
                if (-not $node.HasAttribute($counter) -or $node.GetAttribute($counter) -notmatch '^\d+$') {
                  throw 'JUnit required counters missing or invalid.'
                }
              }
              foreach ($entry in @{ tests = './/testcase'; failures = './/testcase[failure]'; errors = './/testcase[error]'; skipped = './/testcase[skipped]' }.GetEnumerator()) {
                if ($node.HasAttribute($entry.Key)) {
                  if ($node.GetAttribute($entry.Key) -notmatch '^\d+$' -or
                      [long]$node.GetAttribute($entry.Key) -ne $node.SelectNodes($entry.Value).Count) {
                    throw "JUnit $($entry.Key) counter disagrees with actual cases."
                  }
                } elseif ($node.SelectNodes($entry.Value).Count -ne 0) { throw 'JUnit omitted a nonzero counter.' }
              }
            }
            $failures = $document.SelectNodes('//testcase[failure]').Count
            $errors = $document.SelectNodes('//testcase[error]').Count
            $skipped = $document.SelectNodes('//testcase[skipped]').Count
            $retries = $document.SelectNodes('//flakyFailure | //flakyError | //rerunFailure | //rerunError').Count
            # Failed tests are valid observations, not malformed receipts.
            return @{
              tests = $cases.Count; failures = $failures; errors = $errors; skipped = $skipped; retries = $retries
              passing = ($failures + $errors + $skipped + $retries -eq 0)
              sha256 = (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash
            }
          }
          $accountPlans = @(
            @{
              label = 'core-windows-sandbox'; package = 'codex-core'; binary = 'windows_sandbox'; target = @('--test', 'windows_sandbox')
              names = @(
                'windows_sandbox_cli_preserves_managed_deny_reads_across_launches',
                'windows_elevated_temp_only_core_and_direct_spawn_enforce_carveouts',
                'windows_elevated_does_not_create_missing_workspace_metadata',
                'windows_elevated_enforces_deny_read_and_protects_setup_marker',
                'windows_elevated_powershell_preserves_relative_paths',
                'windows_elevated_unified_exec_enforces_large_recursive_deny_reads',
                'windows_elevated_approved_git_pull_preserves_deny_read'
              )
            },
            @{
              label = 'exec-server-filesystem'; package = 'codex-exec-server'; binary = 'file_system_windows'; target = @('--test', 'file_system_windows')
              names = @('file_system_elevated_relative_read_denial_uses_policy_cwd::local', 'file_system_elevated_relative_read_denial_uses_policy_cwd::remote')
            },
            @{
              label = 'exec-server-process'; package = 'codex-exec-server'; binary = 'exec_process'; target = @('--test', 'exec_process')
              names = @('windows_sandbox::tmpdir_uses_command_environment_over_rpc::elevated')
            },
            @{
              label = 'sandbox-library'; package = 'codex-windows-sandbox'; binary = 'codex_windows_sandbox'; target = @('--lib')
              names = @('unified_exec::tests::elevated_non_tty_cmd_forwards_env_output_and_exit')
            }
          )
          foreach ($plan in $accountPlans) {
            $names = ($plan.names | ForEach-Object { "test(=$_)" }) -join ' | '
            $plan.filter = "(package(=$($plan.package)) & binary(=$($plan.binary)) & ($names))"
            $plan.threads = 1
          }
          if (($accountPlans | ForEach-Object { $_.names.Count } | Measure-Object -Sum).Sum -ne 11) { throw 'Expected eleven account cases.' }
          $accountFilter = ($accountPlans | ForEach-Object { $_.filter }) -join ' | '
          $plans = @(@{ label = 'ordinary-workspace'; filter = "not ($accountFilter)"; threads = 2 }) + $accountPlans
          $nextestVersion = @(& cargo nextest --version)
          if ($LASTEXITCODE -ne 0 -or $nextestVersion[0] -notmatch '^cargo-nextest 0\.9\.143(?:\s|$)') { throw 'Exactly nextest 0.9.143 is required.' }
          $junit = Join-Path $env:PILOT_ROOT 'junit.xml'
          $nextestConfig = Join-Path $env:PILOT_ROOT 'nextest-ci.toml'
          @(
            '[profile.local.junit]'
            ('path = ' + (ConvertTo-Json -InputObject $junit -Compress))
            'report-skipped = "none"'
            'store-success-output = false'
            'store-failure-output = false'
          ) | Set-Content -LiteralPath $nextestConfig -Encoding utf8
          $base = @('--tool-config-file', "codex-windows-isolated:$nextestConfig", '--profile', 'local',
            '--locked', '--cargo-profile', 'dev-small', '--features', 'codex-v8-poc/sandbox',
            '--workspace', '--exclude', 'codex-voice-host', '--run-ignored', 'default', '--ignore-default-filter')
          @{
            source_sha = $env:SOURCE_SHA; workflow_sha = $env:GITHUB_SHA; base_arguments = $base
            build_jobs = $env:CARGO_BUILD_JOBS; incremental = $env:CARGO_INCREMENTAL
            nextest = $nextestVersion; cargo = (& cargo --version); rustc = (& rustc -Vv) -join [Environment]::NewLine
            just = (& just --version); python = (& python --version); ripgrep = @(& rg --version); dotslash = @(& dotslash --version)
            nextest_tool_config_sha256 = (Get-FileHash -LiteralPath $nextestConfig -Algorithm SHA256).Hash
            v8_archive_sha256 = (Get-FileHash -LiteralPath $env:RUSTY_V8_ARCHIVE -Algorithm SHA256).Hash
            v8_binding_sha256 = (Get-FileHash -LiteralPath $env:RUSTY_V8_SRC_BINDING_PATH -Algorithm SHA256).Hash
            account_allowlist_source = '5cae58177c3e99376b905f3744bc4630f9247e6c:.github/workflows/rust-ci.yml'
            ignored_policy = 'normal default: listed and retained, not executed'
            exclusions = @('codex-voice-host: matching native SDK absent')
          } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $env:PILOT_EVIDENCE 'campaign.json') -Encoding utf8

          Save-DiskObservation 'workspace-helper-build'
          $helperMessages = Join-Path $env:PILOT_ROOT 'helper-build.jsonl'
          $helperLog = Join-Path $env:PILOT_ROOT 'helper-build.log'
          & cargo build --workspace --exclude codex-voice-host --bins --locked --profile dev-small --features codex-v8-poc/sandbox --message-format json 1> $helperMessages 2> $helperLog
          $helperExit = $LASTEXITCODE
          Save-DiagnosticTail $helperLog 'helper-build-tail'
          if ($helperExit -ne 0) { throw "Workspace helper build failed with exit $helperExit." }
          $helpers = @{}
          foreach ($line in Get-Content -LiteralPath $helperMessages) {
            $message = $line | ConvertFrom-Json -AsHashtable
            if ($message['reason'] -eq 'compiler-artifact' -and $message['target']['kind'] -contains 'bin' -and $message['executable']) {
              $helpers[$message['target']['name']] = @{ path = $message['executable']; package_id = $message['package_id'] }
            }
          }
          foreach ($name in @('codex', 'codex-code-mode-host', 'codex-windows-sandbox-setup', 'codex-command-runner', 'codex-windows-managed-deny-probe')) {
            if (-not $helpers.ContainsKey($name)) { throw "Required same-source helper was not built: $name" }
          }
          foreach ($entry in $helpers.GetEnumerator()) {
            foreach ($key in @($entry.Key, $entry.Key.Replace('-', '_')) | Select-Object -Unique) {
              [Environment]::SetEnvironmentVariable("CARGO_BIN_EXE_$key", $entry.Value.path, 'Process')
            }
          }

          Save-DiskObservation 'complete-workspace-inventory'
          $fullPath = Join-Path $env:PILOT_ROOT 'complete-workspace-inventory.json'
          $listLog = Join-Path $env:PILOT_ROOT 'complete-workspace-list.log'
          & cargo nextest list @base --message-format json 1> $fullPath 2> $listLog
          $listExit = $LASTEXITCODE
          Save-DiagnosticTail $listLog 'complete-workspace-list-tail'
          if ($listExit -ne 0) { throw "Complete workspace inventory failed with exit $listExit." }
          $full = Read-Inventory $fullPath -Full
          Copy-Item -LiteralPath $fullPath -Destination (Join-Path $env:PILOT_EVIDENCE 'complete-workspace-inventory.json')
          $requiredRegression = @($full.selected | Where-Object {
            $_.package -eq 'codex-windows-sandbox' -and $_.test -eq 'unified_exec::tests::legacy_workspace_write_delete_is_limited_to_writable_roots'
          })
          if ($requiredRegression.Count -ne 1) { throw 'The unresolved deletion-boundary test must remain selected.' }
          $allPlanned = @()
          foreach ($plan in $plans) {
            $plan.arguments = $base + @('-E', $plan.filter)
            $inventoryPath = Join-Path $env:PILOT_ROOT "$($plan.label)-inventory.json"
            $listLog = Join-Path $env:PILOT_ROOT "$($plan.label)-list.log"
            & cargo nextest list @($plan.arguments) --message-format json 1> $inventoryPath 2> $listLog
            $listExit = $LASTEXITCODE
            Save-DiagnosticTail $listLog "$($plan.label)-list-tail"
            if ($listExit -ne 0) { throw "Group inventory failed for $($plan.label)." }
            $plan.cases = (Read-Inventory $inventoryPath).selected
            if ($plan.label -ne 'ordinary-workspace') {
              $expected = @($full.selected | Where-Object {
                $_.package -eq $plan.package -and $_.binary -eq $plan.binary -and $plan.names -ccontains $_.test
              })
              if ($expected.Count -ne $plan.names.Count) { throw "Missing exact account allowlist member in $($plan.label)." }
              Assert-SameCases $expected $plan.cases
            }
            $plan.inventory_sha256 = (Get-FileHash -LiteralPath $inventoryPath -Algorithm SHA256).Hash
            $allPlanned += $plan.cases
          }
          Assert-SameCases $full.selected $allPlanned
          if (@($plans[0].cases | Where-Object { $_.test -eq $requiredRegression[0].test }).Count -ne 1) {
            throw 'Deletion-boundary regression is not in the ordinary complement.'
          }
          @{
            source_sha = $env:SOURCE_SHA; listed = $full.listed; selected_count = $full.selected.Count
            ignored_count = $full.ignored.Count; ignored = $full.ignored; plans = $plans
            full_inventory_sha256 = (Get-FileHash -LiteralPath $fullPath -Algorithm SHA256).Hash
          } | ConvertTo-Json -Depth 12 | Set-Content -LiteralPath (Join-Path $env:PILOT_EVIDENCE 'selected-tests.json') -Encoding utf8

          $targetRoot = [IO.Path]::GetFullPath($env:CARGO_TARGET_DIR).TrimEnd('\') + '\'
          $binaryHashes = @{}
          foreach ($path in @($full.selected.binary_path + $helpers.Values.path | Sort-Object -Unique)) {
            if (-not ([IO.Path]::GetFullPath($path)).StartsWith($targetRoot, [StringComparison]::OrdinalIgnoreCase)) {
              throw 'Executable escaped this campaign target directory.'
            }
            $binaryHashes[$path] = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
          }
          foreach ($directory in @($full.selected.binary_path | ForEach-Object { Split-Path -Parent $_ } | Sort-Object -Unique)) {
            $resources = Join-Path $directory 'codex-resources'
            New-Item -ItemType Directory -Path $resources -Force | Out-Null
            foreach ($name in @('codex-windows-sandbox-setup', 'codex-command-runner')) {
              Copy-Item -LiteralPath $helpers[$name].path -Destination (Join-Path $resources "$name.exe") -Force
            }
          }
          @{ source_sha = $env:SOURCE_SHA; helpers = $helpers; sha256_by_path = $binaryHashes } |
            ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $env:PILOT_EVIDENCE 'binary-hashes.json') -Encoding utf8
          $results = @()
          # Invocations are sequential. The ordinary complement has two slots;
          # eleven shared-account cases run last with one slot, so account resets
          # cannot overlap across these groups.
          foreach ($plan in $plans) {
            $result = @{
              group = $plan.label; selected_tests = $plan.cases.Count; exit_code = $null
              receipt_valid = $false; outcome_passed = $false; report = $null; problem = $null
            }
            $log = Join-Path $env:PILOT_ROOT "$($plan.label)-run.log"
            $startedUtc = $null
            try {
              if (Test-Path -LiteralPath $junit) { Remove-Item -LiteralPath $junit }
              Save-DiskObservation "run-$($plan.label)"
              $startedUtc = [DateTime]::UtcNow
              & just test @($plan.arguments) --test-threads $plan.threads --retries 0 2>&1 | Tee-Object -FilePath $log
              $result.exit_code = $LASTEXITCODE
              $result.report = Read-JUnitReport $junit $plan.cases $startedUtc
              $result.receipt_valid = $true
              $result.outcome_passed = ($result.exit_code -eq 0 -and $result.report.passing)
            } catch {
              $result.problem = $_.Exception.Message.Substring(0, [Math]::Min(500, $_.Exception.Message.Length))
            } finally {
              Save-DiagnosticTail $log "$($plan.label)-run-tail"
              if ($null -ne $startedUtc -and (Test-Path -LiteralPath $junit -PathType Leaf)) {
                $reportFile = Get-Item -LiteralPath $junit
                if ($reportFile.Length -le 32MB -and $reportFile.LastWriteTimeUtc -ge $startedUtc) {
                  Copy-Item -LiteralPath $junit -Destination (Join-Path $env:PILOT_EVIDENCE "$($plan.label).xml") -Force
                }
              }
              $results += $result
              $results | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $env:PILOT_EVIDENCE 'results.json') -Encoding utf8
            }
          }
          Save-DiskObservation 'after-tests'
          if (@($results | Where-Object { -not $_.receipt_valid -or -not $_.outcome_passed }).Count) {
            throw 'One or more groups failed, were incomplete, or lacked fresh structurally valid complete receipts. Other group results were retained.'
          }

      - name: Final resource and evidence observation
        if: always()
        run: |
          $root = Join-Path $env:RUNNER_TEMP "cwspace-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $evidence = Join-Path $root 'evidence'
          if (Test-Path -LiteralPath $evidence) {
            Get-PSDrive -PSProvider FileSystem | Select-Object Name, Free, Used |
              ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidence 'final-disks.json') -Encoding utf8
            $files = @(Get-ChildItem -LiteralPath $evidence -File | ForEach-Object {
              @{ name = $_.Name; bytes = $_.Length; sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash }
            })
            $files | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidence 'evidence-hashes.json') -Encoding utf8
          }
          # No global uninstall: discard the VM and its account/ACL effects.
          # No test homes, .sandbox-secrets, profiles, config or credentials retained.

      - name: Retain only bounded qualification evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: windows-supported-workspace-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cwspace-${{ github.run_id }}-${{ github.run_attempt }}/evidence/*.json
            ${{ runner.temp }}/cwspace-${{ github.run_id }}-${{ github.run_attempt }}/evidence/*.jsonl
            ${{ runner.temp }}/cwspace-${{ github.run_id }}-${{ github.run_attempt }}/evidence/*.xml
            ${{ runner.temp }}/cwspace-${{ github.run_id }}-${{ github.run_attempt }}/evidence/*-tail.txt
          retention-days: 1
          if-no-files-found: warn

      - name: Fail closed on incomplete candidate or campaign
        if: always()
        env:
          CANDIDATE_OUTCOME: ${{ steps.candidate.outcome }}
          QUALIFICATION_OUTCOME: ${{ steps.qualification.outcome }}
        run: |
          if ($env:CANDIDATE_OUTCOME -ne 'success' -or $env:QUALIFICATION_OUTCOME -ne 'success') {
            throw 'Candidate build or supported Windows workspace qualification did not pass. No deployment or approval is implied.'
          }
